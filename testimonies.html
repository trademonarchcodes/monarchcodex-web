f;margin:10px 0 15px}.hero p{color:#8f8b84;max-width:680px;margin:auto;line-height:1.8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:10px 0 90px}.card{border:1px solid rgba(212,175,55,.14);border-radius:18px;background:linear-gradient(145deg,#111,#0b0b0b);padding:24px;min-height:210px}.card img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:1px solid rgba(212,175,55,.42);margin-bottom:16px}.card blockquote{margin:0 0 18px;color:#d6d1c7;font-size:12px;line-height:1.9}.card strong{display:block;color:#f0d477;font-size:11px}.card small{display:block;color:#77736b;font-size:9px;margin-top:4px}.empty{text-align:center;padding:40px 20px;border:1px dashed rgba(212,175,55,.18);border-radius:16px;color:#77736b}.footer{border-top:1px solid rgba(255,255,255,.06);padding:28px 0;color:#666;font-size:9px}.footer a{color:#999;text-decoration:none}@media(max-width:800px){.nav-links{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.container{width:min(100% - 28px,1120px)}} </style></head><body><header class="nav"><div class="container nav-inner"><a href="index.html" class="brand"><div class="brand-mark">M</div><div><div class="brand-name">MONARCH CODEX</div><span class="brand-sub">THE INNER KINGDOM</span></div></a><nav class="nav-links"><a href="index.html#about">About</a><a href="index.html#company">Company</a><a href="index.html#trust">Trust</a><a href="testimonies.html">Testimonies</a><a href="index.html#support">Support</a></nav><div class="actions"><a class="btn btn-outline" href="login.html">Login</a><a class="btn btn-gold" href="register.html">Join the Codex</a></div></div></header><main><section class="hero"><div class="container"><div class="kicker">THE MONARCH VOICE</div><h1>Testimonies.</h1><p>Stories and experiences published by the MONARCH CODEX team.</p></div></section><section><div class="container"><div id="testimonyGrid" class="grid"><div class="empty">Loading testimonies…</div></div></div></section></main><footer class="footer"><div class="container">© <span id="year"></span> MONARCH CODEX — The Inner Kingdom · <a href="index.html">Back to homepage</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async function(){document.getElementById('year').textContent=new Date().getFullYear();const URL='https://avaworleivncevaoqeny.supabase.co',KEY='sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));try{const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await db.from('testimonies').select('name,role,message,image_url,created_at').eq('active',true).order('created_at',{ascending:false});if(error)throw error;const box=document.getElementById('testimonyGrid');box.innerHTML=data?.length?data.map(x=>`<article class="card">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name||'Monarch')}">`:''}<blockquote>“${esc(x.message||'')}”</blockquote><strong>${esc(x.name||'Monarch')}</strong>${x.role?`<small>${esc(x.role)}</small>`:''}</article>`).join(''):'<div class="empty" style="grid-column:1/-1">No testimonies have been published yet.</div>'}catch(e){console.error(e);document.getElementById('testimonyGrid').innerHTML='<div class="empty" style="grid-column:1/-1">Testimonies are temporarily unavailable. Please check back shortly.</div>'}})();</script></body></html>
