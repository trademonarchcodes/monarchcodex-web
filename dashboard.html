<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MONARCH CODEX | Dashboard</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: "Poppins", sans-serif;
        }

        button {
            font-family: inherit;
        }

        .dashboard-page {
            min-height: 100vh;
            background: #050505;
        }
    </style>
</head>

<body>

<div class="dashboard-page">

    <header class="dashboard-header">

        <div class="header-inner">

            <div class="brand">
                MONARCH CODEX
            </div>

            <div class="header-right">

                <span class="monarch-badge">
                    MONARCH
                </span>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn">
                    Logout
                </button>

            </div>

        </div>

    </header>
    <main class="dashboard-container">

        <!-- WELCOME -->

        <section class="welcome-section">

            <h1>
                Welcome,
                <span id="memberName">Monarch</span>
            </h1>

            <p>
                Your MONARCH CODEX command center.
            </p>

        </section>


        <!-- MESSAGE -->

        <div
            id="messageBox"
            class="message-box">
        </div>


        <!-- ACCOUNT STATISTICS -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-label">
                    TOTAL INVESTED
                </div>

                <div
                    class="stat-value"
                    id="totalInvested">
                    $0.00
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    CONFIRMED
                </div>

                <div
                    class="stat-value"
                    id="confirmedInvestments">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    PENDING
                </div>

                <div
                    class="stat-value"
                    id="pendingInvestments">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    REQUESTS
                </div>

                <div
                    class="stat-value"
                    id="totalRequests">
                    0
                </div>

            </div>

        </section>
        <!-- PROFILE -->

        <section class="dashboard-section">

            <div class="section-title">

                <h2>Profile</h2>

                <span>MONARCH ACCOUNT</span>

            </div>


            <div class="profile-grid">

                <div class="info-card">

                    <div class="info-label">
                        FULL NAME
                    </div>

                    <div
                        class="info-value"
                        id="profileFullName">
                        —
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        PHONE
                    </div>

                    <div
                        class="info-value"
                        id="profilePhone">
                        —
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        ACCOUNT STATUS
                    </div>

                    <div
                        class="info-value"
                        id="profileStatus">
                        —
                    </div>

                </div>

            </div>

        </section>
        <!-- ACCOUNT OVERVIEW -->

        <section class="dashboard-section">

            <div class="section-title">

                <h2>Account Overview</h2>

                <span>MONARCH STATUS</span>

            </div>


            <div class="overview-grid">

                <div class="info-card">

                    <div class="info-label">
                        ACCOUNT TYPE
                    </div>

                    <div
                        class="info-value"
                        id="accountType">
                        MEMBER
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        MEMBER SINCE
                    </div>

                    <div
                        class="info-value"
                        id="memberSince">
                        —
                    </div>

                </div>


                <div class="info-card">

                    <div class="info-label">
                        VERIFICATION
                    </div>

                    <div
                        class="info-value"
                        id="verificationStatus">
                        PENDING
                    </div>

                </div>

            </div>

        </section>
