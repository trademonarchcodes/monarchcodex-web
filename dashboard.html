<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <title>MONARCH CODEX — Dashboard</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0b1220;
            color: #ffffff;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app-loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .loading-box {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
        }

        .loading-box h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .loading-box p {
            color: rgba(255,255,255,0.65);
            line-height: 1.6;
        }

        .app-shell {
            display: none;
            min-height: 100vh;
        }

        .app-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(11,18,32,0.96);
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .brand-subtitle {
            margin-top: 4px;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
        }

        .app-main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        .welcome-card {
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
        }

        .welcome-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .welcome-card p {
            color: rgba(255,255,255,0.65);
            line-height: 1.6;
        }

        .module-area {
            margin-top: 24px;
        }

        .module-placeholder {
            padding: 24px;
            border-radius: 18px;
            border: 1px dashed rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.55);
            text-align: center;
        }

        .error-message {
            color: #ff8f8f;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- =========================================================
         APPLICATION LOADING SCREEN
         ========================================================= -->

    <div
        id="appLoading"
        class="app-loading"
    >
        <div class="loading-box">

            <h1>MONARCH CODEX</h1>

            <p id="loadingMessage">
                Loading your dashboard...
            </p>

        </div>
    </div>


    <!-- =========================================================
         MAIN APPLICATION
         ========================================================= -->

    <div
        id="appShell"
        class="app-shell"
    >

        <header class="app-header">

            <div class="brand">
                MONARCH CODEX
            </div>

            <div class="brand-subtitle">
                Member Dashboard
            </div>

        </header>


        <main class="app-main">

            <section class="welcome-card">

                <h2 id="welcomeName">
                    Welcome
                </h2>

                <p id="welcomeMessage">
                    Your MONARCH CODEX dashboard is loading.
                </p>

            </section>


            <!-- =================================================
                 MODULE CONTAINER

                 Future modules such as:
                 - Investments
                 - Earnings
                 - Withdrawals
                 - Academy
                 - Signals
                 - Referrals

                 can register and render here.
                 ================================================= -->

            <section
                id="dashboardModules"
                class="module-area"
            >

                <div class="module-placeholder">
                    Dashboard modules will load here.
                </div>

            </section>

        </main>

    </div>


    <!-- =========================================================
         MONARCH CODEX CORE
         ========================================================= -->

    <script>

        /* ========================================================
           SUPABASE CONFIGURATION
           ======================================================== */

        const SUPABASE_URL =
            "https://avaworleivncevaoqeny.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ========================================================
           GLOBAL APPLICATION STATE
           ======================================================== */

        window.MonarchCodex = {

            version: "1.0.0",

            supabase: supabaseClient,

            user: null,

            profile: null,

            modules: {},

            state: {},

            initialized: false

        };


        /* ========================================================
           MODULE REGISTRY
           ======================================================== */

        window.MonarchCodex.registerModule = function (
            name,
            module
        ) {

            if (!name) {
                console.error(
                    "MONARCH CODEX: Module name is required."
                );

                return;
            }

            if (
                typeof module !== "object" ||
                module === null
            ) {

                console.error(
                    "MONARCH CODEX: Invalid module:",
                    name
                );

                return;
            }

            if (
                window.MonarchCodex.modules[name]
            ) {

                console.warn(
                    "MONARCH CODEX: Module already registered:",
                    name
                );

                return;
            }

            window.MonarchCodex.modules[name] =
                module;

            console.log(
                "MONARCH CODEX: Module registered:",
                name
            );

        };


        /* ========================================================
           MODULE INITIALIZATION
           ======================================================== */

        window.MonarchCodex.initializeModules =
            async function () {

                const modules =
                    window.MonarchCodex.modules;

                for (
                    const name of Object.keys(modules)
                ) {

                    const module =
                        modules[name];

                    if (
                        typeof module.init !== "function"
                    ) {
                        continue;
                    }

                    try {

                        await module.init(
                            window.MonarchCodex
                        );

                        console.log(
                            "MONARCH CODEX: Module initialized:",
                            name
                        );

                    } catch (error) {

                        console.error(
                            "MONARCH CODEX: Module initialization failed:",
                            name,
                            error
                        );

                    }

                }

            };


        /* ========================================================
           SHARED UTILITIES
           ======================================================== */

        window.MonarchCodex.utils = {

            escapeHTML(value) {

                if (
                    value === null ||
                    value === undefined
                ) {
                    return "";
                }

                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            },


            formatNumber(
                value,
                decimals = 2
            ) {

                const number =
                    Number(value);

                if (!Number.isFinite(number)) {
                    return "0.00";
                }

                return number.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits:
                            decimals,

                        maximumFractionDigits:
                            decimals
                    }
                );

            },


            formatMoney(
                value,
                decimals = 2
            ) {

                return "$" +
                    this.formatNumber(
                        value,
                        decimals
                    );

            },


            formatDate(value) {

                if (!value) {
                    return "—";
                }

                const date =
                    new Date(value);

                if (
                    Number.isNaN(
                        date.getTime()
                    )
                ) {
                    return "—";
                }

                return date.toLocaleDateString(
                    "en-US",
                    {
                        year: "numeric",
                        month: "short",
                        day: "numeric"
                    }
                );

            },


            setLoadingMessage(message) {

                const element =
                    document.getElementById(
                        "loadingMessage"
                    );

                if (element) {
                    element.textContent =
                        message;
                }

            }

        };


        /* ========================================================
           AUTHENTICATION
           ======================================================== */

        async function getCurrentUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();

            if (error) {

                console.error(
                    "Authentication error:",
                    error
                );

                return null;
            }

            return data?.user || null;

        }


        /* ========================================================
           PROFILE LOADING
           ======================================================== */

        async function loadCurrentProfile(userId) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq("id", userId)
                    .maybeSingle();

            if (error) {

                console.error(
                    "Profile loading error:",
                    error
                );

                throw error;
            }

            return data;

        }


        /* ========================================================
           SHOW APPLICATION
           ======================================================== */

        function showApplication() {

            const loading =
                document.getElementById(
                    "appLoading"
                );

            const shell =
                document.getElementById(
                    "appShell"
                );

            if (loading) {
                loading.style.display =
                    "none";
            }

            if (shell) {
                shell.style.display =
                    "block";
            }

        }


        /* ========================================================
           SHOW LOGIN ERROR
           ======================================================== */

        function showAuthenticationError(
            message
        ) {

            const loading =
                document.getElementById(
                    "appLoading"
                );

            if (!loading) {
                return;
            }

            loading.innerHTML = `

                <div class="loading-box">

                    <h1>
                        MONARCH CODEX
                    </h1>

                    <p class="error-message">
                        ${window.MonarchCodex.utils.escapeHTML(
                            message
                        )}
                    </p>

                </div>

            `;

        }


        /* ========================================================
           UPDATE BASIC MEMBER INFORMATION
           ======================================================== */

        function updateMemberInformation() {

            const profile =
                window.MonarchCodex.profile;

            const user =
                window.MonarchCodex.user;

            const welcomeName =
                document.getElementById(
                    "welcomeName"
                );

            const welcomeMessage =
                document.getElementById(
                    "welcomeMessage"
                );

            if (!profile) {

                if (welcomeName) {
                    welcomeName.textContent =
                        "Welcome";
                }

                if (welcomeMessage) {
                    welcomeMessage.textContent =
                        "Your dashboard is ready.";
                }

                return;
            }

            const name =
                profile.full_name ||
                profile.name ||
                user?.email ||
                "Member";

            if (welcomeName) {

                welcomeName.textContent =
                    "Welcome, " + name;

            }

            if (welcomeMessage) {

                welcomeMessage.textContent =
                    "Your MONARCH CODEX member dashboard is ready.";

            }

        }


        /* ========================================================
           CORE INITIALIZATION
           ======================================================== */

        async function initializeMonarchCodex() {

            try {

                window.MonarchCodex.utils
                    .setLoadingMessage(
                        "Checking your account..."
                    );


                /* -----------------------------------------------
                   AUTHENTICATED USER
                   ----------------------------------------------- */

                const user =
                    await getCurrentUser();

                if (!user) {

                    showAuthenticationError(
                        "You are not logged in. Please return to the login page."
                    );

                    return;
                }


                window.MonarchCodex.user =
                    user;


                /* -----------------------------------------------
                   MEMBER PROFILE
                   ----------------------------------------------- */

                window.MonarchCodex.utils
                    .setLoadingMessage(
                        "Loading your profile..."
                    );

                const profile =
                    await loadCurrentProfile(
                        user.id
                    );

                window.MonarchCodex.profile =
                    profile;


                /* -----------------------------------------------
                   BASIC UI
                   ----------------------------------------------- */

                updateMemberInformation();

                showApplication();


                /* -----------------------------------------------
                   MODULES
                   ----------------------------------------------- */

                window.MonarchCodex.utils
                    .setLoadingMessage(
                        "Loading dashboard modules..."
                    );

                await window.MonarchCodex
                    .initializeModules();


                window.MonarchCodex.initialized =
                    true;


                console.log(
                    "MONARCH CODEX dashboard initialized."
                );


            } catch (error) {

                console.error(
                    "MONARCH CODEX dashboard initialization failed:",
                    error
                );

                showAuthenticationError(
                    "We could not load your dashboard. Please refresh and try again."
                );

            }

        }


        /* ========================================================
           AUTH STATE LISTENER
           ======================================================== */

        supabaseClient.auth.onAuthStateChange(
            (
                event,
                session
            ) => {

                console.log(
                    "MONARCH CODEX auth event:",
                    event
                );

                if (
                    event === "SIGNED_OUT"
                ) {

                    window.location.href =
                        "index.html";

                }

            }
        );


        /* ========================================================
           START APPLICATION
           ======================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                initializeMonarchCodex();

            }
        );

    </script>

</body>
</html>
