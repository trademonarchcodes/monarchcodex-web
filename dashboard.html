<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Monarch Codex | Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <header class="dashboard-header">

        <div class="brand">

            <h1>MONARCH CODEX</h1>

            <span>MONARCH DASHBOARD</span>

        </div>


        <button
            type="button"
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </header>
    <main class="dashboard-main">

        <!-- WELCOME -->

        <section class="welcome-section">

            <p class="eyebrow">
                WELCOME, MONARCH
            </p>

            <h2>
                Welcome back,
                <span id="welcomeName">
                    Monarch
                </span>
            </h2>

            <p>
                Manage your Monarch Codex account,
                investments, and earnings from here.
            </p>

        </section>


        <!-- MESSAGE -->

        <div
            id="dashboardMessage"
            class="message-box">
        </div>


        <!-- ACCOUNT STATISTICS -->

        <section class="stats-grid">

            <div class="stat-card">

                <span>ACCOUNT STATUS</span>

                <strong id="statStatus">
                    —
                </strong>

            </div>


            <div class="stat-card">

                <span>TOTAL INVESTMENT</span>

                <strong id="statInvestment">
                    $0.00
                </strong>

            </div>


            <div class="stat-card">

                <span>TOTAL EARNINGS</span>

                <strong id="statEarnings">
                    $0.00
                </strong>

            </div>

        </section>
