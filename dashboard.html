<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MONARCH CODEX | Dashboard</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: "Poppins", sans-serif;
        }

        button {
            font-family: inherit;
        }

        .dashboard-page {
            min-height: 100vh;
            background: #050505;
        }
    </style>
</head>

<body>

<div class="dashboard-page">

    <header class="dashboard-header">

        <div class="header-inner">

            <div class="brand">
                MONARCH CODEX
            </div>

            <div class="header-right">

                <span class="monarch-badge">
                    MONARCH
                </span>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn">
                    Logout
                </button>

            </div>

        </div>

    </header>
