<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Monarch Codex Member Dashboard"
    >

    <title>Monarch Codex | Member Dashboard</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Dashboard CSS -->
    <link
        rel="stylesheet"
        href="dashboard.css"
    >

</head>

<body>

    <!-- =========================================
         APP LOADING
    ========================================== -->

    <div
        id="appLoading"
        class="app-loading"
    >

        <div class="loading-spinner"></div>

        <p id="loadingMessage">
            Loading your dashboard...
        </p>

    </div>


    <!-- =========================================
         AUTH ERROR
    ========================================== -->

    <div
        id="authError"
        class="auth-error hidden"
    >

        <div class="auth-error-card">

            <div class="auth-error-icon">
                !
            </div>

            <h2>
                Unable to Load Dashboard
            </h2>

            <p id="authErrorMessage">
                Please log in to continue.
            </p>

            <button
                type="button"
                id="returnLoginBtn"
                class="primary-btn"
            >
                Return to Login
            </button>

        </div>

    </div>


    <!-- =========================================
         DASHBOARD APP
    ========================================== -->

    <div
        id="appShell"
        class="app-shell hidden"
    >


        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-logo">

                <a href="index.html">

                    <span class="logo-main">
                        MONARCH
                    </span>

                    <span class="logo-sub">
                        CODEX
                    </span>

                </a>

            </div>


            <!-- MEMBER MINI PROFILE -->

            <div class="sidebar-member">

                <div
                    id="sidebarMemberInitial"
                    class="member-avatar"
                >
                    M
                </div>

                <div class="member-mini-info">

                    <strong id="sidebarMemberName">
                        Member
                    </strong>

                    <span>
                        Monarch Member
                    </span>

                </div>

            </div>


            <!-- NAVIGATION -->

            <nav class="sidebar-nav">

                <button
                    type="button"
                    class="nav-item active"
                    data-section="overview"
                >
                    <span class="nav-icon">
                        ◈
                    </span>

                    <span>
                        Overview
                    </span>
                </button>


                <button
                    type="button"
                    class="nav-item"
                    data-section="profile"
                >
                    <span class="nav-icon">
                        ◉
                    </span>

                    <span>
                        My Profile
                    </span>
                </button>


                <button
                    type="button"
                    class="nav-item"
                    data-section="investment"
                >
                    <span class="nav-icon">
                        ◆
                    </span>

                    <span>
                        Investment
                    </span>
                </button>


                <button
                    type="button"
                    class="nav-item"
                    data-section="history"
                >
                    <span class="nav-icon">
                        ◫
                    </span>

                    <span>
                        Investment History
                    </span>
                </button>


                <button
                    type="button"
                    class="nav-item"
                    data-section="earnings"
                >
                    <span class="nav-icon">
                        ◇
                    </span>

                    <span>
                        Earnings
                    </span>
                </button>


                <button
                    type="button"
                    class="nav-item"
                    data-section="withdrawals"
                >
                    <span class="nav-icon">
                        ⇩
                    </span>

                    <span>
                        Withdrawals
                    </span>
                </button>


                <button
                    type="button"
                    class="nav-item"
                    data-section="referrals"
                >
                    <span class="nav-icon">
                        ♧
                    </span>

                    <span>
                        Referrals
                    </span>
                </button>

            </nav>


            <!-- SIDEBAR BOTTOM -->

            <div class="sidebar-bottom">

                <a
                    href="index.html"
                    class="sidebar-home"
                >
                    ← Back to Website
                </a>

                <button
                    type="button"
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </div>

        </aside>


        <!-- =====================================
             MAIN AREA
        ====================================== -->

        <main class="dashboard-main">


            <!-- TOP HEADER -->

            <header class="dashboard-header">

                <button
                    type="button"
                    id="mobileMenuBtn"
                    class="mobile-menu-btn"
                    aria-label="Open menu"
                >
                    ☰
                </button>


                <div class="header-title">

                    <span>
                        MEMBER DASHBOARD
                    </span>

                    <h1>
                        Welcome,
                        <span id="headerMemberName">
                            Member
                        </span>
                    </h1>

                </div>


                <div class="header-status">

                    <span class="status-dot"></span>

                    <span>
                        Member Area
                    </span>

                </div>

            </header>


            <!-- CONTENT STARTS HERE -->

            <div class="dashboard-content">
