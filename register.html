<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Monarch Codex</title>
    <meta name="description" content="Create your Monarch Codex member account.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">MONARCH<span>CODEX</span></a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </div>
</header>

<main>
    <section class="auth-section">
        <div class="auth-container">

            <div class="auth-header">
                <p class="section-label">BECOME A MONARCH</p>
                <h1>Create Your <span>Account</span></h1>
                <p>Join Monarch Codex and create your personal member account.</p>
            </div>

            <div class="auth-card">

                <form id="registerForm" novalidate>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="referralCode">Referral Code <span style="opacity:.6;">(optional)</span></label>
                        <input
                            type="text"
                            id="referralCode"
                            name="referralCode"
                            placeholder="Enter referral code"
                            autocomplete="off"
                        >
                    </div>

                    <div
                        id="referralNotice"
                        class="form-message"
                        style="display:none;"
                    ></div>

                    <div
                        id="registrationMessage"
                        class="form-message"
                        style="display:none;"
                    ></div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="registerButton"
                    >
                        Create Account
                    </button>

                </form>

                <div class="auth-footer">
                    <p>
                        Already have an account?
                        <a href="login.html">Login here</a>
                    </p>
                </div>

            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer-container">
        <div>
            <div class="logo">MONARCH<span>CODEX</span></div>
            <p>Learn. Build. Trade. Create.</p>
        </div>

        <div class="footer-bottom">
            <p>
                © <span id="currentYear"></span> Monarch Codex.
                All rights reserved.
            </p>
        </div>
    </div>
</footer>

<script>
(function () {
    "use strict";

    const SUPABASE_URL = "https://avaworleivncevaoqeny.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("registrationMessage");
    const referralNotice = document.getElementById("referralNotice");
    const referralInput = document.getElementById("referralCode");
    const currentYear = document.getElementById("currentYear");

    let supabaseClient = null;

    if (currentYear) {
        currentYear.textContent = new Date().getFullYear();
    }

    function showMessage(text, type = "info") {
        if (!message) return;

        message.textContent = text;
        message.style.display = "block";
        message.style.padding = "12px";
        message.style.marginTop = "12px";
        message.style.borderRadius = "10px";
        message.style.lineHeight = "1.5";
        message.style.fontSize = "13px";

        if (type === "success") {
            message.style.color = "#D4AF37";
            message.style.background = "rgba(212,175,55,.08)";
            message.style.border = "1px solid rgba(212,175,55,.25)";
        } else if (type === "error") {
            message.style.color = "#ff8585";
            message.style.background = "rgba(255,70,70,.08)";
            message.style.border = "1px solid rgba(255,70,70,.25)";
        } else {
            message.style.color = "#fff";
            message.style.background = "rgba(255,255,255,.05)";
            message.style.border = "1px solid rgba(255,255,255,.12)";
        }
    }

    function setLoading(loading) {
        if (!button) return;

        button.disabled = loading;
        button.textContent = loading
            ? "Creating Account..."
            : "Create Account";
    }

    function getReferralCode() {
        const params = new URLSearchParams(window.location.search);
        return (
            params.get("ref") ||
            params.get("referral") ||
            localStorage.getItem("monarch_referral_code") ||
            ""
        ).trim().toUpperCase();
    }

    function initializeReferral() {
        const referralCode = getReferralCode();

        if (!referralCode || !referralInput) return;

        referralInput.value = referralCode;

        if (referralNotice) {
            referralNotice.textContent =
                "Referral code detected: " + referralCode;
            referralNotice.style.display = "block";
            referralNotice.style.color = "#D4AF37";
        }

        localStorage.setItem("monarch_referral_code", referralCode);
    }

    function getFriendlyError(error) {
        const message = error?.message || String(error || "Unknown error");

        if (/already registered|user already registered/i.test(message)) {
            return "This email is already registered. Please log in instead.";
        }

        if (/invalid.*email|email.*invalid/i.test(message)) {
            return "Please enter a valid email address.";
        }

        if (/password/i.test(message) && /weak|short|characters/i.test(message)) {
            return "Password must be at least 6 characters.";
        }

        if (error?.status === 429) {
            return "Too many attempts. Please wait a few minutes and try again.";
        }

        if (/row-level security|rls|permission denied/i.test(message)) {
            return "Your account was created, but the member profile could not be saved because database permissions are blocking profile creation. Please contact the administrator.";
        }

        return message;
    }

    async function createMemberProfile(user, fullName, phone) {
        /*
         * IMPORTANT:
         * Only columns known to exist in the current Monarch Codex
         * profiles table are written here:
         *
         * id, full_name, phone, role, status
         *
         * This prevents registration from failing because of old/
         * unconfirmed columns such as referral_code, balance,
         * kyc_status, display_username, etc.
         */
        const profile = {
            id: user.id,
            full_name: fullName,
            phone: phone,
            role: "member",
            status: "pending"
        };

        const { data, error } = await supabaseClient
            .from("profiles")
            .insert(profile)
            .select()
            .single();

        if (!error) {
            return data;
        }

        /*
         * If a database trigger already created the profile,
         * update the existing row instead of failing registration.
         */
        if (error.code === "23505") {
            const { data: existingProfile, error: updateError } =
                await supabaseClient
                    .from("profiles")
                    .update({
                        full_name: fullName,
                        phone: phone
                    })
                    .eq("id", user.id)
                    .select()
                    .single();

            if (updateError) {
                throw updateError;
            }

            return existingProfile;
        }

        throw error;
    }

    async function registerUser(event) {
        event.preventDefault();

        if (!supabaseClient) {
            showMessage(
                "The secure registration system is not ready. Please refresh the page and try again.",
                "error"
            );
            return;
        }

        const fullName = document
            .getElementById("fullName")
            .value
            .trim()
            .replace(/\s+/g, " ");

        const email = document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const phone = document
            .getElementById("phone")
            .value
            .trim();

        const password = document
            .getElementById("password")
            .value;

        const referralCode = referralInput?.value
            ?.trim()
            ?.toUpperCase() || "";

        if (fullName.length < 3) {
            showMessage("Please enter your full name.", "error");
            return;
        }

        if (!email) {
            showMessage("Please enter your email address.", "error");
            return;
        }

        if (phone.length < 7) {
            showMessage("Please enter a valid phone number.", "error");
            return;
        }

        if (password.length < 6) {
            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );
            return;
        }

        setLoading(true);
        showMessage("Creating your account...", "info");

        try {
            /*
             * STEP 1 — CREATE AUTH USER
             */
            const { data, error } =
                await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone,
                            referral_code: referralCode || null
                        }
                    }
                });

            if (error) {
                console.error("SUPABASE AUTH ERROR:", error);
                throw error;
            }

            if (!data || !data.user) {
                throw new Error(
                    "Supabase did not return a user account after registration."
                );
            }

            const user = data.user;

            /*
             * Supabase can return an existing user with an empty
             * identity list when the email is already registered.
             */
            if (
                Array.isArray(user.identities) &&
                user.identities.length === 0
            ) {
                throw new Error(
                    "This email is already registered. Please log in instead."
                );
            }

            /*
             * STEP 2 — SAVE MEMBER PROFILE
             *
             * When email confirmation is disabled, Supabase returns
             * a session and the insert can be protected by auth.uid().
             */
            if (data.session) {
                await createMemberProfile(
                    user,
                    fullName,
                    phone
                );
            } else {
                /*
                 * If email confirmation is enabled, the browser does
                 * not receive an authenticated session yet. We cannot
                 * safely bypass RLS from the public registration page.
                 *
                 * The Auth account is still created. The user must
                 * confirm the email and then log in. If the project
                 * has a database trigger that creates profiles, the
                 * profile will already exist.
                 */
                const { data: existingProfile, error: profileCheckError } =
                    await supabaseClient
                        .from("profiles")
                        .select("id")
                        .eq("id", user.id)
                        .maybeSingle();

                if (profileCheckError) {
                    console.warn(
                        "Profile check after email-confirmation signup:",
                        profileCheckError
                    );
                }

                if (!existingProfile) {
                    showMessage(
                        "Your login account was created. Please confirm your email, then log in. Your member profile will be completed when your account is activated.",
                        "success"
                    );

                    localStorage.setItem(
                        "monarch_last_email",
                        email
                    );

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3000);

                    return;
                }
            }

            /*
             * STEP 3 — SAVE REFERRAL LOCALLY FOR THE NEXT
             * REFERRAL MODULE. We intentionally do not write
             * referral columns that are not confirmed in the
             * current profiles schema.
             */
            if (referralCode) {
                localStorage.setItem(
                    "monarch_last_referral",
                    referralCode
                );
            }

            localStorage.setItem(
                "monarch_last_email",
                email
            );

            showMessage(
                data.session
                    ? "Account created successfully. Your Monarch profile has been saved."
                    : "Account created successfully. Please check your email to confirm your account.",
                "success"
            );

            button.textContent = "Account Created";

            setTimeout(() => {
                window.location.href =
                    data.session
                        ? "dashboard.html"
                        : "login.html";
            }, data.session ? 1500 : 3000);

        } catch (error) {
            console.error(
                "MONARCH CODEX REGISTRATION ERROR:",
                error
            );

            showMessage(
                getFriendlyError(error),
                "error"
            );

        } finally {
            setLoading(false);
        }
    }

    async function initializeSupabase() {
        try {
            if (
                !window.supabase ||
                typeof window.supabase.createClient !== "function"
            ) {
                throw new Error(
                    "Supabase JavaScript library failed to load."
                );
            }

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY,
                    {
                        auth: {
                            persistSession: true,
                            autoRefreshToken: true,
                            detectSessionInUrl: true
                        }
                    }
                );

            console.log(
                "MONARCH CODEX REGISTRATION SUPABASE READY"
            );

        } catch (error) {
            console.error(
                "SUPABASE INITIALIZATION ERROR:",
                error
            );

            showMessage(
                "The secure registration system could not be initialized. Please refresh the page.",
                "error"
            );
        }
    }

    document.addEventListener("DOMContentLoaded", async function () {
        await initializeSupabase();
        initializeReferral();

        if (form) {
            form.addEventListener(
                "submit",
                registerUser
            );
        }
    });

})();
</script>

</body>
</html>
