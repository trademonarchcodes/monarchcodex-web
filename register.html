<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Monarch Codex</title>

    <meta
        name="description"
        content="Create your Monarch Codex member account."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="navbar">

    <div class="nav-container">

        <a
            href="index.html"
            class="logo"
        >
            MONARCH<span>CODEX</span>
        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </div>

</header>



<!-- =====================================================
     REGISTRATION
     ===================================================== -->

<main>

    <section class="auth-section">

        <div class="auth-container">


            <div class="auth-header">

                <p class="section-label">
                    BECOME A MONARCH
                </p>


                <h1>
                    Create Your <span>Account</span>
                </h1>


                <p>
                    Join Monarch Codex and create your personal member account.
                </p>

            </div>



            <div class="auth-card">


                <form
                    id="registerForm"
                    novalidate
                >


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>


                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>


                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >

                    </div>



                    <!-- REFERRAL INFORMATION -->

                    <div
                        id="referralNotice"
                        class="form-message"
                        style="display:none;"
                    ></div>


                    <!-- REFERRAL VALUE IS KEPT FOR FUTURE
                         REFERRAL MODULE INTEGRATION -->

                    <input
                        type="hidden"
                        id="referralCode"
                        name="referralCode"
                    >



                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="registerButton"
                    >
                        Create Account
                    </button>



                    <!-- MESSAGE -->

                    <p
                        id="registrationMessage"
                        class="form-message"
                        style="display:none;"
                    ></p>


                </form>



                <!-- AUTH FOOTER -->

                <div class="auth-footer">

                    <p>

                        Already have an account?

                        <a href="login.html">
                            Login here
                        </a>

                    </p>

                </div>


            </div>

        </div>

    </section>

</main>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="footer">

    <div class="footer-container">


        <div>

            <div class="logo">
                MONARCH<span>CODEX</span>
            </div>


            <p>
                Learn. Build. Trade. Create.
            </p>

        </div>



        <div class="footer-bottom">

            <p>
                ©
                <span id="currentYear"></span>
                Monarch Codex.
                All rights reserved.
            </p>

        </div>


    </div>

</footer>



<!-- =====================================================
     SUPABASE LIBRARY
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<!-- =====================================================
     MONARCH CODEX CORE
     ===================================================== -->

<script src="script.js"></script>



<!-- =====================================================
     REGISTRATION PAGE LOGIC
     ===================================================== -->

<script>

(function () {

    "use strict";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const form =
        document.getElementById(
            "registerForm"
        );


    const button =
        document.getElementById(
            "registerButton"
        );


    const message =
        document.getElementById(
            "registrationMessage"
        );


    const referralNotice =
        document.getElementById(
            "referralNotice"
        );


    const referralInput =
        document.getElementById(
            "referralCode"
        );


    const currentYear =
        document.getElementById(
            "currentYear"
        );



    /* =====================================================
       YEAR
       ===================================================== */

    if (currentYear) {

        currentYear.textContent =
            new Date().getFullYear();

    }



    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(
        text,
        type = "info"
    ) {

        if (!message) {
            return;
        }


        message.textContent =
            text;


        message.style.display =
            "block";


        message.className =
            "form-message";


        if (type === "success") {

            message.style.color =
                "#D4AF37";

        }

        else if (type === "error") {

            message.style.color =
                "#ff6b6b";

        }

        else {

            message.style.color =
                "#ffffff";

        }

    }



    /* =====================================================
       LOADING
       ===================================================== */

    function setLoading(
        loading
    ) {

        if (!button) {
            return;
        }


        button.disabled =
            loading;


        button.textContent =
            loading
                ? "Creating Account..."
                : "Create Account";

    }



    /* =====================================================
       REFERRAL CAPTURE
       ===================================================== */

    function initializeReferral() {

        const core =
            window.MonarchCodex?.core;


        if (!core) {
            return;
        }


        const referralCode =
            core.getReferralCode();


        if (!referralCode) {
            return;
        }


        /*
         * We intentionally do NOT write this to Supabase yet.
         *
         * This keeps registration safe while we build
         * the proper referral database structure.
         */

        if (referralInput) {

            referralInput.value =
                referralCode;

        }


        if (referralNotice) {

            referralNotice.textContent =
                "Referral code detected: " +
                referralCode;


            referralNotice.style.display =
                "block";


            referralNotice.style.color =
                "#D4AF37";

        }


        console.log(
            "REFERRAL CODE DETECTED:",
            referralCode
        );

    }



    /* =====================================================
       REGISTRATION
       ===================================================== */

    async function registerUser(
        event
    ) {

        event.preventDefault();


        const fullName =
            document
                .getElementById("fullName")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const referralCode =
            referralInput?.value
                ?.trim()
                ?.toUpperCase() ||
            null;



        /* =================================================
           VALIDATION
           ================================================= */

        if (
            !fullName ||
            !email ||
            !phone ||
            !password
        ) {

            showMessage(
                "Please complete all required fields.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }



        /* =================================================
           CORE
           ================================================= */

        const core =
            window.MonarchCodex?.core;


        if (!core) {

            showMessage(
                "The MONARCH CODEX system could not be loaded. Please refresh the page.",
                "error"
            );

            return;

        }


        const supabase =
            core.getSupabase();


        if (!supabase) {

            showMessage(
                "Unable to connect to the registration system. Please try again.",
                "error"
            );

            return;

        }



        /* =================================================
           LOADING
           ================================================= */

        setLoading(true);


        showMessage(
            "Creating your account...",
            "info"
        );



        try {


            /* =============================================
               CREATE AUTH ACCOUNT
               ============================================= */

            const {
                data,
                error
            } =
                await supabase.auth.signUp({

                    email,

                    password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            phone:
                                phone

                        }

                    }

                });



            if (error) {

                console.error(
                    "REGISTRATION ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to create your account.",
                    "error"
                );


                setLoading(false);

                return;

            }



            /* =============================================
               VERIFY AUTH USER
               ============================================= */

            if (
                !data ||
                !data.user
            ) {

                showMessage(
                    "Account creation failed. Please try again.",
                    "error"
                );


                setLoading(false);

                return;

            }



            console.log(
                "AUTH ACCOUNT CREATED:",
                data.user.id
            );


            /*
             * Referral is intentionally only captured here
             * for now.
             *
             * The actual referral relationship will be
             * connected after we establish the proper
             * database structure.
             */

            if (referralCode) {

                console.log(
                    "REFERRAL TO CONNECT:",
                    referralCode
                );

            }



            /* =============================================
               SUCCESS
               ============================================= */

            showMessage(
                "Account created successfully. Your account is now pending approval.",
                "success"
            );


            button.textContent =
                "Account Created";


            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                2500
            );


        }


        catch (error) {

            console.error(
                "UNEXPECTED REGISTRATION ERROR:",
                error
            );


            showMessage(
                error?.message ||
                "Something went wrong. Please try again.",
                "error"
            );


            setLoading(false);

        }

    }



    /* =====================================================
       FORM LISTENER
       ===================================================== */

    if (form) {

        form.addEventListener(
            "submit",
            registerUser
        );

    }



    /* =====================================================
       INITIALIZE
       ===================================================== */

    initializeReferral();


})();

</script>


</body>

</html>
