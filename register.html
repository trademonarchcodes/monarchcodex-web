<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONARCH CODEX — Register</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:100%;max-width:560px;background:#121212;border:1px solid #292929;border-radius:20px;padding:26px;box-shadow:0 20px 60px #0008}h1{text-align:center;color:#d4af37;letter-spacing:2px;font-size:26px;margin:0}.sub{text-align:center;color:#999;margin:6px 0 25px;font-size:13px}h2{margin:0 0 6px;font-size:21px}.intro{color:#aaa;font-size:13px;line-height:1.6;margin:0 0 20px}label{display:block;color:#ddd;font-size:12px;font-weight:bold;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #333;border-radius:10px;background:#080808;color:#fff;font:inherit;outline:none}input:focus{border-color:#d4af37}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.terms{display:flex;gap:9px;align-items:flex-start;color:#999;font-size:12px;line-height:1.6;margin:18px 0}.terms input{width:17px;height:17px;margin:2px 0;accent-color:#d4af37}a{color:#d4af37}button{width:100%;padding:14px;border:0;border-radius:11px;background:#d4af37;color:#080808;font-weight:800;font-size:13px;cursor:pointer}button:disabled{opacity:.55}#status,#error{display:none;margin-top:13px;padding:12px;border-radius:10px;font-size:12px;line-height:1.6;word-break:break-word}#status{background:#17140a;border:1px solid #4a3b12;color:#d4af37}#error{background:#210d0d;border:1px solid #682020;color:#ffb1b1}.bottom{text-align:center;color:#999;font-size:13px;margin-top:18px}@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:22px 17px}}
</style>
</head>
<body><div class="wrap"><main class="card">
<img src="assets/monarch-mark.svg" alt="MONARCH CODEX logo" style="width:76px;height:60px;object-fit:contain;display:block;margin:0 auto 6px"><h1>MONARCH CODEX</h1><div class="sub">The Inner Kingdom</div>
<h2>Create Your Monarch Account</h2><p class="intro">Register with your real details. Your full name should match your NIN identity information.</p>
<form id="registerForm" novalidate>
<label for="fullName">Full Name — as shown on NIN</label><input id="fullName" type="text" autocomplete="name" required>
<div class="row"><div><label for="phone">Phone Number</label><input id="phone" type="tel" autocomplete="tel" required></div><div><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required></div></div>
<label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required>
<label for="referral">Referral Code <span style="color:#777">(optional)</span></label><input id="referral" type="text" autocomplete="off">
<div class="terms"><input id="terms" type="checkbox" required><div>I agree to the platform Terms, Rules, and Privacy Policy.</div></div>
<button id="registerBtn" type="submit">CREATE MONARCH ACCOUNT</button>
</form>
<div id="status"></div><div id="error"></div>
<div class="bottom">Already have an account? <a href="login.html">Log in</a></div>
</main></div>
<script>
"use strict";
const SUPABASE_URL="https://avaworleivncevaoqeny.supabase.co";
const SUPABASE_KEY="sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";
let client=null,registering=false;
const $=id=>document.getElementById(id);
function showStatus(m){$("error").style.display="none";$("error").textContent="";$("status").textContent=m;$("status").style.display="block"}
function showError(m){$("status").style.display="none";$("status").textContent="";$("error").textContent=m;$("error").style.display="block"}
function clearMessages(){["status","error"].forEach(id=>{$(id).textContent="";$(id).style.display="none"})}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("Request timed out. Please check your internet connection and try again.")),ms))])}
function friendlyError(e){let m=e&&e.message?e.message:"Registration failed.";if(/user already registered|already registered/i.test(m))return"This email is already registered. Please log in instead.";if(/over_email_send_rate_limit|email.*rate limit|rate limit.*email|email.*too many/i.test(m))return"Registration email delivery is temporarily rate-limited. Please try again later, or contact MONARCH CODEX support to restore registration capacity.";if(/over_request_rate_limit|too many requests|too many attempts/i.test(m))return"Registration traffic is temporarily rate-limited. Please wait a few minutes before trying again.";if(/password/i.test(m)&&/6|weak|short/i.test(m))return"Password must be at least 6 characters.";if(/failed to fetch|networkerror|load failed/i.test(m))return"Could not reach Supabase. Check your internet connection and try again.";if(e&&e.status===429)return"Registration is temporarily rate-limited. Please wait a few minutes and try again.";return m}
async function connect(){
 if(!window.supabase||typeof window.supabase.createClient!=="function")throw new Error("Supabase library failed to load.");
 client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const r=await withTimeout(fetch(SUPABASE_URL+"/auth/v1/settings",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY},cache:"no-store"}),10000);
 if(!r.ok)throw new Error("Supabase Auth returned HTTP "+r.status+".");
}
async function register(){
 if(registering)return;
 const cooldownUntil=Number(sessionStorage.getItem("monarch_signup_cooldown_until")||0);if(Date.now()<cooldownUntil){const seconds=Math.ceil((cooldownUntil-Date.now())/1000);return showError("Please wait "+seconds+" seconds before trying registration again.")}
 clearMessages();
 const fullName=$("fullName").value.trim().replace(/\s+/g," "),phone=$("phone").value.trim().replace(/\s+/g,""),email=$("email").value.trim().toLowerCase(),password=$("password").value,referral=$("referral").value.trim().toUpperCase(),terms=$("terms").checked,btn=$("registerBtn");
 if(fullName.length<3)return showError("Please enter your full name.");
 if(phone.length<7)return showError("Please enter a valid phone number.");
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showError("Please enter a valid email address.");
 if(password.length<6)return showError("Password must be at least 6 characters.");
 if(!terms)return showError("Please accept the Terms, Rules, and Privacy Policy.");
 if(!client)return showError("The secure registration service is not ready. Please refresh the page and try again.");
 registering=true;btn.disabled=true;btn.textContent="CREATING ACCOUNT...";
 try{
  showStatus("Creating your secure Monarch account...");
  const r=await withTimeout(client.auth.signUp({email,password,options:{data:{full_name:fullName,phone:phone,referral_code:referral||null}}}),20000);
  if(r.error)throw r.error;
  if(!r.data||!r.data.user)throw new Error("Supabase did not return a user account.");
  localStorage.setItem("monarch_last_email",email);
  if(r.data.session){showStatus("Account created successfully. Opening your Monarch dashboard...");setTimeout(()=>location.replace("dashboard.html"),700)}
  else{showStatus("Account created successfully. Check your email to confirm your account, then log in.");setTimeout(()=>location.replace("login.html"),3000)}
 }catch(e){console.error("MONARCH CODEX REGISTRATION ERROR:",e);if(e&&e.status===429)sessionStorage.setItem("monarch_signup_cooldown_until",String(Date.now()+60000));showError(friendlyError(e))}
 finally{registering=false;btn.disabled=false;btn.textContent="CREATE MONARCH ACCOUNT"}
}
document.addEventListener("DOMContentLoaded",async()=>{
 $("registerForm").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();register();return false});
 try{
  const ref=new URLSearchParams(window.location.search).get("ref");
  if(ref){
   const code=String(ref).trim();
   if(code && code.length<=120){
    $("referral").value=code;
    $("referral").setAttribute("readonly","readonly");
   }
  }
 }catch(e){console.warn("Referral link parameter could not be read:",e)}
 try{await connect();showStatus("Registration service connected.");setTimeout(()=>{if($("status").textContent==="Registration service connected.")$("status").style.display="none"},1500)}
 catch(e){console.error("MONARCH CODEX CONNECTION ERROR:",e);showError("Registration service connection failed. "+friendlyError(e))}
});
</script></body></html>
