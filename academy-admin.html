<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONARCH CODEX — Academy Content</title>
<style>
:root{--g:#d4af37;--g2:#f4d66d;--bg:#070707;--card:#111318;--line:#292929;--muted:#999;--text:#f5f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a{color:var(--g2);text-decoration:none}.brand{color:var(--g);font-weight:800;letter-spacing:1px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#aaa;font-size:11px;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}textarea{min-height:78px;resize:vertical}.btn{border:1px solid #6b5620;background:#d4af37;color:#080808;padding:9px 12px;border-radius:8px;font-weight:800;cursor:pointer}.btn.secondary{background:#171717;color:#eee;border-color:#444}.btn.danger{background:#251010;color:#ffaaaa;border-color:#672d2d}.btn:disabled{opacity:.45;cursor:not-allowed}.muted{color:var(--muted);font-size:12px;line-height:1.5}.notice{padding:11px;border:1px solid #57481f;background:#171308;border-radius:9px;color:#dec778}.item{border-top:1px solid #242424;padding:13px 0}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid #444;border-radius:999px;padding:3px 7px;font-size:9px;text-transform:uppercase;color:#bbb}.pill.published,.pill.approved{color:#9fe0ae;border-color:#2e5739}.pill.pending{color:#e2c875}.pill.draft,.pill.rejected{color:#e89a9a;border-color:#593030}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">MONARCH CODEX — ACADEMY</div><a href="admin.html">← Admin Dashboard</a></div>
  <div id="msg" class="notice">Checking access…</div>
  <main id="app" hidden>
    <section class="card"><h2>Academy Settings</h2><div class="grid">
      <div><label>Academy price</label><input id="price" type="number" min="0" step="0.01"></div>
      <div><label>Currency</label><input id="currency" value="USD"></div>
      <div><label>YouTube channel ID</label><input id="channelId"></div>
      <div><label>YouTube channel URL</label><input id="channelUrl"></div>
      <div><label>Academy active</label><select id="active"><option value="true">Active</option><option value="false">Disabled</option></select></div>
    </div><button class="btn" id="saveSettings">Save Settings</button></section>

    <section class="card"><h2>Add Lesson</h2><div class="grid">
      <div><label>Lesson number</label><input id="lessonPosition" type="number" min="1"></div>
      <div><label>Lesson title</label><input id="lessonTitle"></div>
      <div class="full"><label>Description</label><textarea id="lessonDescription"></textarea></div>
    </div><button class="btn" id="addLesson">Add Lesson</button></section>

    <section class="card"><h2>Add Course</h2><p class="muted">Only videos you intentionally add here become Academy courses. Other uploads on your YouTube channel remain separate.</p><div class="grid">
      <div><label>Lesson</label><select id="courseLesson"></select></div>
      <div><label>Course number</label><input id="coursePosition" type="number" min="1"></div>
      <div><label>Course title</label><input id="courseTitle"></div>
      <div><label>YouTube URL or video ID</label><input id="videoId" placeholder="https://youtube.com/watch?v=..."></div>
      <div class="full"><label>Description</label><textarea id="courseDescription"></textarea></div>
    </div><button class="btn" id="addCourse">Add Course</button></section>

    <section class="card"><h2>Subscription Requests</h2><div id="subs" class="muted">Loading…</div></section>
    <section class="card"><h2>Academy Structure</h2><div id="structure" class="muted">Loading…</div></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const db=supabase.createClient("https://avaworleivncevaoqeny.supabase.co","sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh");
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
let lessons=[],courses=[],subs=[];

function msg(t,error=false){$("msg").textContent=t;$("msg").style.borderColor=error?"#672d2d":"#57481f";$("msg").style.color=error?"#ffaaaa":"#dec778";$("msg").hidden=false}
function videoId(v){v=String(v||"").trim();try{const u=new URL(v);if(u.searchParams.get("v"))return u.searchParams.get("v");if(u.hostname==="youtu.be")return u.pathname.replace(/^\//,"");if(u.pathname.includes("/embed/"))return u.pathname.split("/embed/")[1].split("/")[0]}catch(e){}return v}
function roleOK(r){const x=String(r||"").toLowerCase().trim();return x==="admin"||x==="super_admin"||x==="sovereign_desk"||x==="sovereign-desk"||x.includes("admin")}

async function load(){
  const st=await db.from("academy_settings").select("*").eq("id",true).maybeSingle();if(st.error)throw st.error;
  if(st.data){$("price").value=st.data.academy_price??0;$("currency").value=st.data.currency||"USD";$("channelId").value=st.data.youtube_channel_id||"";$("channelUrl").value=st.data.youtube_channel_url||"";$("active").value=String(st.data.active!==false)}
  const l=await db.from("academy_lessons").select("*").order("position");if(l.error)throw l.error;lessons=l.data||[];
  const c=await db.from("academy_courses").select("*").order("position");if(c.error)throw c.error;courses=c.data||[];
  const sr=await db.from("academy_subscriptions").select("id,user_id,amount,fee,status,admin_reason,created_at").order("created_at",{ascending:false}).limit(100);if(sr.error)throw sr.error;subs=sr.data||[];
  $("courseLesson").innerHTML=lessons.map(x=>'<option value="'+x.id+'">Lesson '+x.position+' — '+esc(x.title)+'</option>').join("");
  renderSubscriptions();renderStructure();
}
function renderSubscriptions(){
  const pending=subs.filter(x=>x.status==="pending");
  $("subs").innerHTML=pending.length?pending.map(x=>'<div class="item"><div><b>Member:</b> '+esc(x.user_id)+'<div class="muted">Amount: '+Number(x.amount||0).toFixed(2)+' · Fee: '+Number(x.fee||0).toFixed(2)+' · Total: '+(Number(x.amount||0)+Number(x.fee||0)).toFixed(2)+' · '+new Date(x.created_at).toLocaleString()+'</div></div><div class="actions" style="margin-top:8px"><input id="reason-'+x.id+'" placeholder="Reason for rejection (required)" style="max-width:360px"><button class="btn" data-sub="'+x.id+'" data-approve="1">Approve</button><button class="btn danger" data-sub="'+x.id+'" data-approve="0">Reject & Refund</button></div></div>').join(""):'<p class="muted">No pending subscription requests.</p>';
}
function renderStructure(){
  $("structure").innerHTML=lessons.length?lessons.map(l=>{const cs=courses.filter(c=>c.lesson_id===l.id).sort((a,b)=>a.position-b.position);return '<div class="item"><div class="row"><div><b>Lesson '+l.position+' — '+esc(l.title)+'</b><div class="muted">'+esc(l.description||"")+' · <span class="pill '+esc(l.status)+'">'+esc(l.status)+'</span></div></div><div class="actions"><button class="btn secondary" data-edit-lesson="'+l.id+'">Edit</button><button class="btn secondary" data-toggle-lesson="'+l.id+'">'+(l.status==="published"?"Unpublish":"Publish")+'</button><button class="btn secondary" data-move-lesson="'+l.id+'" data-dir="-1">↑</button><button class="btn secondary" data-move-lesson="'+l.id+'" data-dir="1">↓</button><button class="btn danger" data-remove-lesson="'+l.id+'">Remove</button></div></div>'+cs.map(c=>'<div style="margin:10px 0 0 16px;padding-top:10px;border-top:1px solid #202020"><div class="row"><div><b>Course '+c.position+' — '+esc(c.title)+'</b><div class="muted">'+esc(c.youtube_video_id)+' · <span class="pill '+esc(c.status)+'">'+esc(c.status)+'</span></div></div><div class="actions"><button class="btn secondary" data-edit-course="'+c.id+'">Edit</button><button class="btn secondary" data-toggle-course="'+c.id+'">'+(c.status==="published"?"Unpublish":"Publish")+'</button><button class="btn secondary" data-move-course="'+c.id+'" data-dir="-1">↑</button><button class="btn secondary" data-move-course="'+c.id+'" data-dir="1">↓</button><button class="btn danger" data-remove-course="'+c.id+'">Remove</button></div></div></div>').join("")+'</div>'}).join(""):'<p class="muted">No lessons yet.</p>';
}
async function reviewSub(id,approve){
  const reason=approve?prompt("Approval note (optional):",""):prompt("Reason for rejecting this subscription:","");
  if(reason===null)return;if(!approve&&!reason.trim())return msg("A rejection reason is required.",true);
  const r=await db.rpc(approve?"approve_academy_subscription":"reject_academy_subscription",{p_subscription_id:id,p_admin_reason:reason.trim()||null});if(r.error)throw r.error;await load();msg(approve?"Subscription approved.":"Subscription rejected and funds returned.");
}
async function editLesson(id){const x=lessons.find(v=>v.id===id);if(!x)return;const title=prompt("Lesson title",x.title);if(title===null)return;const description=prompt("Lesson description",x.description||"");if(description===null)return;const r=await db.from("academy_lessons").update({title:title.trim(),description:description.trim()||null,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error;await load();msg("Lesson updated.")}
async function toggleLesson(id){const x=lessons.find(v=>v.id===id);if(!x)return;const r=await db.from("academy_lessons").update({status:x.status==="published"?"draft":"published",updated_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error;await load();msg("Lesson status updated.")}
async function removeLesson(id){if(!confirm("Remove this lesson from Academy? YouTube videos are not deleted."))return;if(courses.some(c=>c.lesson_id===id))return msg("Remove its courses first.",true);const r=await db.from("academy_lessons").delete().eq("id",id);if(r.error)throw r.error;await load();msg("Lesson removed.")}
async function moveLesson(id,dir){const a=lessons.slice().sort((x,y)=>x.position-y.position),i=a.findIndex(x=>x.id===id),j=i+Number(dir);if(i<0||j<0||j>=a.length)return;const A=a[i],B=a[j],tmp=1000000+Date.now()%100000;let r=await db.from("academy_lessons").update({position:tmp,updated_at:new Date().toISOString()}).eq("id",A.id);if(r.error)throw r.error;r=await db.from("academy_lessons").update({position:A.position,updated_at:new Date().toISOString()}).eq("id",B.id);if(r.error)throw r.error;r=await db.from("academy_lessons").update({position:B.position,updated_at:new Date().toISOString()}).eq("id",A.id);if(r.error)throw r.error;await load();msg("Lesson order updated.")}
async function editCourse(id){const x=courses.find(v=>v.id===id);if(!x)return;const title=prompt("Course title",x.title);if(title===null)return;const description=prompt("Course description",x.description||"");if(description===null)return;const video=prompt("YouTube video ID or URL",x.youtube_video_id);if(video===null)return;const r=await db.from("academy_courses").update({title:title.trim(),description:description.trim()||null,youtube_video_id:videoId(video),updated_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error;await load();msg("Course updated.")}
async function toggleCourse(id){const x=courses.find(v=>v.id===id);if(!x)return;const r=await db.from("academy_courses").update({status:x.status==="published"?"draft":"published",updated_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error;await load();msg("Course status updated.")}
async function removeCourse(id){if(!confirm("Remove this course from Academy? The YouTube video will not be deleted."))return;const r=await db.from("academy_courses").delete().eq("id",id);if(r.error)throw r.error;await load();msg("Course removed.")}
async function moveCourse(id,dir){const x=courses.find(v=>v.id===id);if(!x)return;const a=courses.filter(v=>v.lesson_id===x.lesson_id).sort((m,n)=>m.position-n.position),i=a.findIndex(v=>v.id===id),j=i+Number(dir);if(i<0||j<0||j>=a.length)return;const A=a[i],B=a[j],tmp=1000000+Date.now()%100000;let r=await db.from("academy_courses").update({position:tmp,updated_at:new Date().toISOString()}).eq("id",A.id);if(r.error)throw r.error;r=await db.from("academy_courses").update({position:A.position,updated_at:new Date().toISOString()}).eq("id",B.id);if(r.error)throw r.error;r=await db.from("academy_courses").update({position:B.position,updated_at:new Date().toISOString()}).eq("id",A.id);if(r.error)throw r.error;await load();msg("Course order updated.")}

$("subs").addEventListener("click",e=>{const b=e.target.closest("[data-sub]");if(b)reviewSub(b.dataset.sub,b.dataset.approve==="1").catch(x=>msg(x.message,true))});
$("structure").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;let p;if(b.dataset.editLesson)p=editLesson(b.dataset.editLesson);else if(b.dataset.toggleLesson)p=toggleLesson(b.dataset.toggleLesson);else if(b.dataset.moveLesson)p=moveLesson(b.dataset.moveLesson,b.dataset.dir);else if(b.dataset.removeLesson)p=removeLesson(b.dataset.removeLesson);else if(b.dataset.editCourse)p=editCourse(b.dataset.editCourse);else if(b.dataset.toggleCourse)p=toggleCourse(b.dataset.toggleCourse);else if(b.dataset.moveCourse)p=moveCourse(b.dataset.moveCourse,b.dataset.dir);else if(b.dataset.removeCourse)p=removeCourse(b.dataset.removeCourse);if(p)p.catch(x=>msg(x.message,true))});
$("saveSettings").onclick=async()=>{try{const r=await db.from("academy_settings").upsert({id:true,academy_price:Number($("price").value)||0,currency:$("currency").value.trim()||"USD",active:$("active").value==="true",youtube_channel_id:$("channelId").value.trim()||null,youtube_channel_url:$("channelUrl").value.trim()||null,updated_at:new Date().toISOString()});if(r.error)throw r.error;msg("Settings saved.")}catch(e){msg(e.message,true)}};
$("addLesson").onclick=async()=>{try{const r=await db.from("academy_lessons").insert({title:$("lessonTitle").value.trim(),description:$("lessonDescription").value.trim()||null,position:Number($("lessonPosition").value),status:"published"});if(r.error)throw r.error;await load();msg("Lesson added.")}catch(e){msg(e.message,true)}};
$("addCourse").onclick=async()=>{try{const r=await db.from("academy_courses").insert({lesson_id:$("courseLesson").value,title:$("courseTitle").value.trim(),description:$("courseDescription").value.trim()||null,youtube_video_id:videoId($("videoId").value),position:Number($("coursePosition").value),status:"published"});if(r.error)throw r.error;await load();msg("Course added.")}catch(e){msg(e.message,true)}};

let academyAdminBooted=false;
async function academyAdminBoot(session){
  if(academyAdminBooted)return;
  academyAdminBooted=true;
  try{
    if(!session){location.href="login.html";return}
    const p=await db.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
    if(p.error)throw p.error;
    if(!roleOK(p.data?.role)){location.href="dashboard.html";return}
    $("app").hidden=false;
    await load();
    $("msg").hidden=true;
  }catch(e){
    console.error("Academy admin boot error:",e);
    msg(e.message||"Academy admin could not load.",true);
  }
}
db.auth.onAuthStateChange((event,session)=>{
  if(event==="INITIAL_SESSION"||event==="SIGNED_IN")setTimeout(()=>academyAdminBoot(session),0);
  if(event==="SIGNED_OUT")location.href="login.html";
});
setTimeout(()=>{if(!academyAdminBooted)msg("Academy access is taking too long. Please refresh and try again.",true)},12000);
</script>
</body>
</html>
