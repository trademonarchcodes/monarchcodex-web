<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONARCH CODEX — Academy Content</title><style>body{margin:0;background:#070707;color:#eee;font:15px Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#111318;border:1px solid #292929;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}.full{grid-column:1/-1}.btn{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #5b4b1f;background:#d4af37;color:#080808;font-weight:700}.muted{color:#999}.notice{padding:10px;background:#171308;border:1px solid #59491e;border-radius:9px;color:#dfc17a}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><p><a href="admin.html" style="color:#f4d66d">← Admin Dashboard</a></p><h1 style="color:#d4af37">Academy Content</h1><div id="msg" class="notice">Checking access…</div><div id="app" hidden><section class="card"><h2>Settings</h2><div class="grid"><div><label>Academy price</label><input id="price" type="number" min="0" step="0.01"></div><div><label>Currency</label><input id="currency" value="USD"></div><div><label>YouTube channel ID</label><input id="channelId"></div><div><label>YouTube channel URL</label><input id="channelUrl"></div></div><button class="btn" id="save">Save Settings</button></section><section class="card"><h2>Add Lesson</h2><div class="grid"><div><label>Lesson title</label><input id="lt"></div><div><label>Lesson number</label><input id="lp" type="number" min="1"></div><div class="full"><label>Description</label><textarea id="ld"></textarea></div></div><button class="btn" id="addLesson">Add Lesson</button></section><section class="card"><h2>Add Course</h2><p class="muted">Upload the video to YouTube normally, then add only the videos that belong to the Academy here. Other YouTube uploads are unaffected.</p><div class="grid"><div><label>Lesson</label><select id="cl"></select></div><div><label>Course number</label><input id="cp" type="number" min="1"></div><div><label>Course title</label><input id="ct"></div><div><label>YouTube URL or video ID</label><input id="yv" placeholder="https://youtube.com/watch?v=..."></div><div class="full"><label>Description</label><textarea id="cd"></textarea></div></div><button class="btn" id="addCourse">Add Course</button></section><section class="card"><h2>Current Structure</h2><div id="list"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://avaworleivncevaoqeny.supabase.co","sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh");const $=x=>document.getElementById(x);let lessons=[],courses=[];
function msg(t){$("msg").textContent=t;$("msg").hidden=false}
function vid(v){v=v.trim();try{const u=new URL(v);if(u.searchParams.get("v"))return u.searchParams.get("v");if(u.hostname==="youtu.be")return u.pathname.slice(1)}catch(e){}return v}
async function load(){const s=await db.from("academy_settings").select("*").eq("id",true).maybeSingle();if(s.data){$("price").value=s.data.academy_price;$("currency").value=s.data.currency;$("channelId").value=s.data.youtube_channel_id||"";$("channelUrl").value=s.data.youtube_channel_url||""}const l=await db.from("academy_lessons").select("*").order("position");const c=await db.from("academy_courses").select("*").order("position");if(l.error)throw l.error;if(c.error)throw c.error;lessons=l.data||[];courses=c.data||[];$("cl").innerHTML=lessons.map(x=>'<option value="'+x.id+'">Lesson '+x.position+' — '+x.title+'</option>').join("");$("list").innerHTML=lessons.map(x=>{const cs=courses.filter(c=>c.lesson_id===x.id);return '<div style="padding:12px 0;border-top:1px solid #292929"><b>Lesson '+x.position+' — '+x.title+'</b><div class="muted">'+(x.description||"")+'</div>'+cs.map(c=>'<div style="padding:8px 0 0 15px">Course '+c.position+' — '+c.title+' <span class="muted">('+c.youtube_video_id+')</span></div>').join("")+'</div>'}).join("")||'<p class="muted">No lessons yet.</p>'}
async function guard(){const s=await db.auth.getSession();if(!s.data.session){location.href="login.html";return}const p=await db.from("profiles").select("role").eq("id",s.data.session.user.id).maybeSingle();if(p.data?.role!=="admin"){location.href="dashboard.html";return}$("app").hidden=false;$("msg").hidden=true;await load()}
$("save").onclick=async()=>{const r=await db.from("academy_settings").upsert({id:true,academy_price:Number($("price").value)||0,currency:$("currency").value||"USD",youtube_channel_id:$("channelId").value||null,youtube_channel_url:$("channelUrl").value||null,updated_at:new Date().toISOString()});msg(r.error?r.error.message:"Settings saved.")};
$("addLesson").onclick=async()=>{const r=await db.from("academy_lessons").insert({title:$("lt").value.trim(),description:$("ld").value.trim()||null,position:Number($("lp").value),status:"published"});if(r.error)return msg(r.error.message);await load();msg("Lesson added.")};
$("addCourse").onclick=async()=>{const r=await db.from("academy_courses").insert({lesson_id:$("cl").value,title:$("ct").value.trim(),description:$("cd").value.trim()||null,youtube_video_id:vid($("yv").value),position:Number($("cp").value),status:"published"});if(r.error)return msg(r.error.message);await load();msg("Course added.")};
guard().catch(e=>msg(e.message));
</script></body></html>
