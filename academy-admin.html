<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONARCH CODEX — Academy Content</title><style>body{margin:0;background:#070707;color:#eee;font:15px Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#111318;border:1px solid #292929;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}.full{grid-column:1/-1}.btn{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #5b4b1f;background:#d4af37;color:#080808;font-weight:700}.muted{color:#999}.notice{padding:10px;background:#171308;border:1px solid #59491e;border-radius:9px;color:#dfc17a}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><p><a href="admin.html" style="color:#f4d66d">← Admin Dashboard</a></p><h1 style="color:#d4af37">Academy Content</h1><div id="msg" class="notice">Checking access…</div><div id="app" hidden><section class="card"><h2>Settings</h2><div class="grid"><div><label>Academy price</label><input id="price" type="number" min="0" step="0.01"></div><div><label>Currency</label><input id="currency" value="USD"></div><div><label>YouTube channel ID</label><input id="channelId"></div><div><label>YouTube channel URL</label><input id="channelUrl"></div></div><button class="btn" id="save">Save Settings</button></section><section class="card"><h2>Add Lesson</h2><div class="grid"><div><label>Lesson title</label><input id="lt"></div><div><label>Lesson number</label><input id="lp" type="number" min="1"></div><div class="full"><label>Description</label><textarea id="ld"></textarea></div></div><button class="btn" id="addLesson">Add Lesson</button></section><section class="card"><h2>Add Course</h2><p class="muted">Upload the video to YouTube normally, then add only the videos that belong to the Academy here. Other YouTube uploads are unaffected.</p><div class="grid"><div><label>Lesson</label><select id="cl"></select></div><div><label>Course number</label><input id="cp" type="number" min="1"></div><div><label>Course title</label><input id="ct"></div><div><label>YouTube URL or video ID</label><input id="yv" placeholder="https://youtube.com/watch?v=..."></div><div class="full"><label>Description</label><textarea id="cd"></textarea></div></div><button class="btn" id="addCourse">Add Course</button></section><section class="card"><h2>Subscription Requests</h2><div id="subs"></div></section><section class="card"><h2>Current Structure</h2><div id="list"></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const esc=x=>String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));\nconst db=supabase.createClient("https://avaworleivncevaoqeny.supabase.co","sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh");const $=x=>document.getElementById(x);let lessons=[],courses=[];
function msg(t){$("msg").textContent=t;$("msg").hidden=false}
function vid(v){v=v.trim();try{const u=new URL(v);if(u.searchParams.get("v"))return u.searchParams.get("v");if(u.hostname==="youtu.be")return u.pathname.slice(1)}catch(e){}return v}
async function load(){const s=await db.from("academy_settings").select("*").eq("id",true).maybeSingle();if(s.data){$("price").value=s.data.academy_price;$("currency").value=s.data.currency;$("channelId").value=s.data.youtube_channel_id||"";$("channelUrl").value=s.data.youtube_channel_url||""}const sr=await db.from("academy_subscriptions").select("id,user_id,amount,status,admin_reason,created_at").eq("status","pending").order("created_at",{ascending:false});if(sr.error)throw sr.error;$("subs").innerHTML=sr.data?.length?sr.data.map(x=>'<div style="padding:12px 0;border-top:1px solid #292929"><b>Member: '+x.user_id+'</b><div class="muted">Amount: '+x.amount+' · Requested: '+new Date(x.created_at).toLocaleString()+'</div><input id="reason-'+x.id+'" placeholder="Reason (required for rejection)"><button class="btn" onclick="reviewSub(\''+x.id+'\',true)">Approve</button> <button class="btn" onclick="reviewSub(\''+x.id+'\',false)">Reject & Refund</button></div>').join(""):'<p class="muted">No pending subscription requests.</p>";const l=await db.from("academy_lessons").select("*").order("position");const c=await db.from("academy_courses").select("*").order("position");if(l.error)throw l.error;if(c.error)throw c.error;lessons=l.data||[];courses=c.data||[];$("cl").innerHTML=lessons.map(x=>'<option value="'+x.id+'">Lesson '+x.position+' — '+x.title+'</option>').join("");$("list").innerHTML=lessons.map(x=>{const cs=courses.filter(c=>c.lesson_id===x.id).sort((a,b)=>a.position-b.position);return '<div style="padding:12px 0;border-top:1px solid #292929"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><b>Lesson '+x.position+' — '+esc(x.title)+'</b><div class="muted">'+esc(x.description||"")+'</div></div><div><button class="btn" onclick="editLesson(\''+x.id+'\')">Edit</button> <button class="btn" onclick="toggleLesson(\''+x.id+'\')">'+(x.status==='published'?'Unpublish':'Publish')+'</button> <button class="btn" onclick="moveLesson(\''+x.id+'\',-1)">↑</button> <button class="btn" onclick="moveLesson(\''+x.id+'\',1)">↓</button> <button class="btn" onclick="removeLesson(\''+x.id+'\')">Remove</button></div></div>'+cs.map(c=>'<div style="padding:8px 0 0 15px;border-top:1px solid #202020;margin-top:8px"><b>Course '+c.position+' — '+esc(c.title)+'</b> <span class="muted">('+esc(c.youtube_video_id)+')</span> <span class="muted">['+esc(c.status)+']</span><div><button class="btn" onclick="editCourse(\''+c.id+'\')">Edit</button> <button class="btn" onclick="toggleCourse(\''+c.id+'\')">'+(c.status==='published'?'Unpublish':'Publish')+'</button> <button class="btn" onclick="moveCourse(\''+c.id+'\',-1)">↑</button> <button class="btn" onclick="moveCourse(\''+c.id+'\',1)">↓</button> <button class="btn" onclick="removeCourse(\''+c.id+'\')">Remove</button></div></div>').join("")+'</div>'}).join("")||'<p class="muted">No lessons yet.</p>'}
async function editLesson(id){const x=lessons.find(v=>v.id===id);if(!x)return;const title=prompt("Lesson title",x.title);if(title===null)return;const description=prompt("Lesson description",x.description||"");if(description===null)return;const r=await db.from("academy_lessons").update({title:title.trim(),description:description.trim()||null,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return msg(r.error.message);await load();msg("Lesson updated.");}
async function toggleLesson(id){const x=lessons.find(v=>v.id===id);if(!x)return;const r=await db.from("academy_lessons").update({status:x.status==="published"?"draft":"published",updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return msg(r.error.message);await load();msg("Lesson status updated.");}
async function removeLesson(id){if(!confirm("Remove this lesson from the Academy? Its YouTube videos are not deleted."))return;const has=courses.some(c=>c.lesson_id===id);if(has)return msg("Remove or move its courses first.");const r=await db.from("academy_lessons").delete().eq("id",id);if(r.error)return msg(r.error.message);await load();msg("Lesson removed from Academy.");}
async function moveLesson(id,dir){const a=lessons.slice().sort((x,y)=>x.position-y.position),i=a.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=a.length)return;const A=a[i],B=a[j],tmp=1000000+Math.floor(Date.now()%100000);let r=await db.from("academy_lessons").update({position:tmp,updated_at:new Date().toISOString()}).eq("id",A.id);if(r.error)return msg(r.error.message);r=await db.from("academy_lessons").update({position:A.position,updated_at:new Date().toISOString()}).eq("id",B.id);if(r.error)return msg(r.error.message);r=await db.from("academy_lessons").update({position:B.position,updated_at:new Date().toISOString()}).eq("id",A.id);if(r.error)return msg(r.error.message);await load();msg("Lesson order updated.");}
async function editCourse(id){const x=courses.find(v=>v.id===id);if(!x)return;const title=prompt("Course title",x.title);if(title===null)return;const description=prompt("Course description",x.description||"");if(description===null)return;const video=prompt("YouTube video ID or URL",x.youtube_video_id);if(video===null)return;const r=await db.from("academy_courses").update({title:title.trim(),description:description.trim()||null,youtube_video_id:vid(video),updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return msg(r.error.message);await load();msg("Course updated.");}
async function toggleCourse(id){const x=courses.find(v=>v.id===id);if(!x)return;const r=await db.from("academy_courses").update({status:x.status==="published"?"draft":"published",updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return msg(r.error.message);await load();msg("Course status updated.");}
async function removeCourse(id){if(!confirm("Remove this course from the Academy? The YouTube video will not be deleted."))return;const r=await db.from("academy_courses").delete().eq("id",id);if(r.error)return msg(r.error.message);await load();msg("Course removed from Academy.");}
async function moveCourse(id,dir){const x=courses.find(v=>v.id===id);if(!x)return;const a=courses.filter(v=>v.lesson_id===x.lesson_id).sort((m,n)=>m.position-n.position),i=a.findIndex(v=>v.id===id),j=i+dir;if(i<0||j<0||j>=a.length)return;const r1=await db.from("academy_courses").update({position:a[j].position+0.5,updated_at:new Date().toISOString()}).eq("id",a[i].id);if(r1.error)return msg(r1.error.message);const r2=await db.from("academy_courses").update({position:a[i].position,updated_at:new Date().toISOString()}).eq("id",a[j].id);if(r2.error)return msg(r2.error.message);const r3=await db.from("academy_courses").update({position:a[j].position,updated_at:new Date().toISOString()}).eq("id",a[i].id);if(r3.error)return msg(r3.error.message);await load();msg("Course order updated.");}
window.reviewSub=async(id,approve)=>{const reason=document.getElementById("reason-"+id)?.value.trim()||"";if(!approve&&!reason)return msg("Enter a reason before rejecting.");const fn=approve?"approve_academy_subscription":"reject_academy_subscription";const r=await db.rpc(fn,{p_subscription_id:id,p_admin_reason:reason||null});if(r.error)return msg(r.error.message);await load();msg(approve?"Subscription approved.":"Subscription rejected and funds returned.")};\nasync function guard(){const s=await db.auth.getSession();if(!s.data.session){location.href="login.html";return}const p=await db.from("profiles").select("role").eq("id",s.data.session.user.id).maybeSingle();if(!["admin","sovereign_desk"].includes(String(p.data?.role||"").toLowerCase())){location.href="dashboard.html";return}$("app").hidden=false;$("msg").hidden=true;await load()}
$("save").onclick=async()=>{const r=await db.from("academy_settings").upsert({id:true,academy_price:Number($("price").value)||0,currency:$("currency").value||"USD",youtube_channel_id:$("channelId").value||null,youtube_channel_url:$("channelUrl").value||null,updated_at:new Date().toISOString()});msg(r.error?r.error.message:"Settings saved.")};
$("addLesson").onclick=async()=>{const r=await db.from("academy_lessons").insert({title:$("lt").value.trim(),description:$("ld").value.trim()||null,position:Number($("lp").value),status:"published"});if(r.error)return msg(r.error.message);await load();msg("Lesson added.")};
$("addCourse").onclick=async()=>{const r=await db.from("academy_courses").insert({lesson_id:$("cl").value,title:$("ct").value.trim(),description:$("cd").value.trim()||null,youtube_video_id:vid($("yv").value),position:Number($("cp").value),status:"published"});if(r.error)return msg(r.error.message);await load();msg("Course added.")};
guard().catch(e=>msg(e.message));
</script></body></html>
