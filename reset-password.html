<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | MONARCH CODEX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:460px;background:#121212;border:1px solid rgba(212,175,55,.35);border-radius:20px;padding:30px 24px;box-shadow:0 20px 70px #0009}img{width:76px;height:60px;object-fit:contain;display:block;margin:0 auto 6px}h1{text-align:center;color:#d4af37;letter-spacing:2px;font-size:25px;margin:0}.sub{text-align:center;color:#999;font-size:13px;margin:7px 0 26px}h2{margin:0 0 7px;font-size:21px}.intro{color:#aaa;font-size:13px;line-height:1.6;margin:0 0 20px}label{display:block;color:#ddd;font-size:12px;font-weight:bold;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #333;border-radius:10px;background:#080808;color:#fff;font:inherit;outline:none}input:focus{border-color:#d4af37}.password-wrap{position:relative}.password-wrap input{padding-right:56px}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:1px solid rgba(212,175,55,.3);border-radius:8px;background:#17130a;color:#d4af37;padding:8px 10px;cursor:pointer}.submit{width:100%;padding:14px;margin-top:18px;border:0;border-radius:11px;background:#d4af37;color:#080808;font-weight:800;font-size:13px;cursor:pointer}.submit:disabled{opacity:.55}.message{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.6}.info{background:#17140a;border:1px solid #4a3b12;color:#d4af37}.error{background:#210d0d;border:1px solid #682020;color:#ffb1b1}.bottom{text-align:center;margin-top:20px;font-size:13px;color:#999}a{color:#d4af37;text-decoration:none}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<img src="assets/monarch-mark.svg" alt="MONARCH CODEX logo">
<h1>MONARCH CODEX</h1><div class="sub">Secure Account Recovery</div>

<section id="requestView">
<h2>Forgot your password?</h2>
<p class="intro">Enter the email address on your MONARCH CODEX account and we’ll send you a secure password-reset link.</p>
<label for="email">Email Address</label>
<input id="email" type="email" autocomplete="email" placeholder="Enter your email">
<button class="submit" id="sendBtn" type="button">SEND RESET LINK</button>
</section>

<section id="resetView" class="hidden">
<h2>Create a new password</h2>
<p class="intro">Choose a new password for your MONARCH CODEX account.</p>
<label for="password">New Password</label>
<div class="password-wrap"><input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters"><button class="toggle" id="togglePassword" type="button">Show</button></div>
<label for="confirm">Confirm New Password</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Enter it again">
<button class="submit" id="updateBtn" type="button">UPDATE PASSWORD</button>
</section>

<div id="message" class="message"></div>
<div class="bottom"><a href="login.html">← Back to login</a></div>
</main></div>

<script>
"use strict";
const SUPABASE_URL="https://avaworleivncevaoqeny.supabase.co";
const SUPABASE_KEY="sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const requestView=document.getElementById("requestView"),resetView=document.getElementById("resetView"),message=document.getElementById("message"),sendBtn=document.getElementById("sendBtn"),updateBtn=document.getElementById("updateBtn");
function showMessage(text,type="info"){message.textContent=text;message.className="message "+type;message.style.display="block"}
function showReset(){requestView.classList.add("hidden");resetView.classList.remove("hidden")}
function friendlyError(e){const m=String(e?.message||"");if(/rate limit|too many/i.test(m))return"Password reset emails are temporarily rate-limited. Please wait a little and try again.";if(/redirect.*url|not allowed/i.test(m))return"Password recovery is not fully configured yet. Please contact MONARCH CODEX support.";return m||"Something went wrong. Please try again."}
async function sendReset(){const email=document.getElementById("email").value.trim().toLowerCase();if(!email)return showMessage("Please enter your email address.","error");sendBtn.disabled=true;sendBtn.textContent="SENDING...";message.style.display="none";try{const r=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/reset-password.html"});if(r.error)throw r.error;showMessage("If that email belongs to a MONARCH CODEX account, a secure password-reset link has been sent. Check your inbox and spam folder.","info")}catch(e){console.error("MONARCH CODEX PASSWORD RESET ERROR:",e);showMessage(friendlyError(e),"error")}finally{sendBtn.disabled=false;sendBtn.textContent="SEND RESET LINK"}}
async function updatePassword(){const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p.length<6)return showMessage("Password must be at least 6 characters.","error");if(p!==c)return showMessage("The passwords do not match.","error");updateBtn.disabled=true;updateBtn.textContent="UPDATING...";try{const s=await client.auth.getSession();if(!s.data.session)throw new Error("This reset link is missing or has expired. Please request a new one.");const r=await client.auth.updateUser({password:p});if(r.error)throw r.error;showMessage("Password updated successfully. You can now log in with your new password.","info");setTimeout(()=>location.replace("login.html"),1800)}catch(e){console.error("MONARCH CODEX PASSWORD UPDATE ERROR:",e);showMessage(friendlyError(e),"error")}finally{updateBtn.disabled=false;updateBtn.textContent="UPDATE PASSWORD"}}
sendBtn.addEventListener("click",sendReset);updateBtn.addEventListener("click",updatePassword);
document.getElementById("togglePassword").addEventListener("click",function(){const p=document.getElementById("password");p.type=p.type==="password"?"text":"password";this.textContent=p.type==="password"?"Show":"Hide"});
(async()=>{try{const s=await client.auth.getSession();if(s.data.session)showReset();else{const hasRecovery=window.location.hash.includes("access_token")||window.location.hash.includes("type=recovery");if(hasRecovery){setTimeout(async()=>{const again=await client.auth.getSession();if(again.data.session)showReset();else showMessage("This reset link is missing or has expired. Please request a new one.","error")},700)}}}catch(e){console.error(e)}})();
client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)showReset()});
</script>
</body>
</html>
