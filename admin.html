<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MONARCH CODEX | Admin Command Center</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {
            --gold: #D4AF37;
            --black: #080808;
            --dark: #111111;
            --dark-card: #161616;
            --border: rgba(212, 175, 55, 0.25);
            --text: #f5f5f5;
            --muted: #a0a0a0;
            --green: #7be6a1;
            --red: #ff9292;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: var(--black);
            color: var(--text);
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        .admin-page {
            min-height: 100vh;
            background: var(--black);
        }


        /* =================================================
           HEADER
        ================================================= */

        .admin-header {
            padding: 18px 5%;
            border-bottom: 1px solid var(--border);
            background: #080808;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .admin-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .admin-brand h1 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--gold);
        }


        .admin-badge {
            padding: 5px 10px;

            border: 1px solid var(--gold);
            color: var(--gold);

            border-radius: 20px;

            font-size: 0.7rem;
            font-weight: 700;
        }


        .logout-btn {
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);

            padding: 9px 16px;
            border-radius: 7px;

            font-family: inherit;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .logout-btn:hover {
            background: var(--gold);
            color: #000;
        }


        .logout-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =================================================
           MAIN CONTAINER
        ================================================= */

        .admin-container {
            width: min(1400px, 92%);
            margin: 0 auto;

            padding: 35px 0 60px;
        }


        .page-title {
            margin-bottom: 25px;
        }


        .page-title h2 {
            margin: 0;
            color: var(--gold);
        }


        .page-title p {
            color: var(--muted);
            margin-bottom: 0;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        .message-box {
            display: none;

            margin: 20px 0;

            padding: 14px;

            border-radius: 8px;

            word-break: break-word;
        }


        .message-box.error {
            display: block;

            background: rgba(201, 75, 75, 0.1);

            border: 1px solid rgba(201, 75, 75, 0.6);

            color: #ffb0b0;
        }


        .message-box.success {
            display: block;

            background: rgba(76, 175, 114, 0.1);

            border: 1px solid rgba(76, 175, 114, 0.6);

            color: #a9f0c1;
        }


        .message-box.warning {
            display: block;

            background: rgba(212, 175, 55, 0.1);

            border: 1px solid rgba(212, 175, 55, 0.5);

            color: #f5d979;
        }


        /* =================================================
           OVERVIEW STATS
        ================================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 16px;

            margin-bottom: 35px;
        }


        .stat-card {
            background: var(--dark-card);

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 20px;

            min-width: 0;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }


        .stat-card:hover {
            transform: translateY(-2px);

            border-color:
                rgba(212, 175, 55, 0.55);
        }


        .stat-card span {
            color: var(--muted);

            font-size: 0.8rem;

            line-height: 1.4;
        }


        .stat-card strong {
            display: block;

            color: var(--gold);

            font-size: 1.8rem;

            margin-top: 10px;

            word-break: break-word;
        }


        .stat-card.total-invested strong {
            font-size: 1.55rem;
        }


        /* =================================================
           SECTION CARDS
        ================================================= */

        .section-card {
            background: var(--dark);

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 28px;

            overflow: hidden;
        }


        .section-heading {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 12px;

            margin-bottom: 18px;

            flex-wrap: wrap;
        }


        .section-heading h3 {
            margin: 0;

            color: var(--gold);
        }


        .section-status {
            color: var(--muted);

            font-size: 0.8rem;
        }


        /* =================================================
           TABLES
        ================================================= */

        .table-wrapper {
            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }


        table {
            width: 100%;

            min-width: 850px;

            border-collapse: collapse;
        }


        th,
        td {
            padding: 14px 12px;

            text-align: left;

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            font-size: 0.82rem;

            vertical-align: middle;
        }


        th {
            color: var(--gold);

            font-weight: 600;

            white-space: nowrap;
        }


        td {
            color: var(--text);
        }


        tbody tr:hover {
            background:
                rgba(255,255,255,0.025);
        }


        /* =================================================
           UID
        ================================================= */

        .monarch-uid {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            color: var(--gold);

            font-weight: 700;

            white-space: nowrap;
        }


        .uid-copy-btn {
            border: 1px solid
                rgba(212,175,55,0.35);

            background:
                rgba(212,175,55,0.06);

            color: var(--gold);

            padding: 4px 7px;

            border-radius: 5px;

            font-size: 0.7rem;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }


        .uid-copy-btn:hover {
            background:
                rgba(212,175,55,0.15);

            border-color:
                rgba(212,175,55,0.65);
        }


        /* =================================================
           STATUS
        ================================================= */

        .status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 0.72rem;

            font-weight: 600;

            text-transform: capitalize;

            white-space: nowrap;
        }


        .status-pending {
            color: var(--gold);

            background:
                rgba(212,175,55,0.08);
        }


        .status-active,
        .status-confirmed,
        .status-approved,
        .status-completed {
            color: var(--green);

            background:
                rgba(123,230,161,0.08);
        }


        .status-blocked,
        .status-rejected {
            color: var(--red);

            background:
                rgba(255,146,146,0.08);
        }


        /* =================================================
           ACTION BUTTONS
        ================================================= */

        .action-buttons {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }


        .action-btn {
            border: none;

            border-radius: 6px;

            padding: 8px 11px;

            font-family: inherit;

            cursor: pointer;

            font-size: 0.76rem;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .action-btn:hover {
            transform: translateY(-1px);
        }


        .action-btn:disabled {
            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        .activate-btn,
        .confirm-btn,
        .add-earning-btn {
            background: var(--gold);

            color: #000;
        }


        .block-btn,
        .reject-btn,
        .delete-earning-btn {
            background: transparent;

            color: #ff9696;

            border: 1px solid #c94b4b;
        }


        .view-receipt-btn {
            background:
                rgba(212,175,55,0.12);

            color: var(--gold);

            border:
                1px solid rgba(212,175,55,0.4);
        }


        /* =================================================
           LOADING / EMPTY / ERROR
        ================================================= */

        .loading-text,
        .empty-text {
            color: var(--muted);
        }


        .error-text {
            color: #ff9696;
        }


        /* =================================================
           INVESTMENT / PAYMENT DETAILS
        ================================================= */

        .investment-details {
            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .investment-details strong {
            color: var(--text);
        }


        .investment-details small {
            color: var(--muted);

            font-size: 0.72rem;
        }


        .payment-details {
            display: flex;

            flex-direction: column;

            gap: 4px;
        }


        .payment-details strong {
            color: var(--text);
        }


        .payment-details small {
            color: var(--muted);

            font-size: 0.7rem;
        }


        .receipt-status {
            font-size: 0.72rem;

            color: var(--muted);
        }


        .receipt-status.pending {
            color: var(--gold);
        }


        .receipt-status.approved {
            color: var(--green);
        }


        .receipt-status.rejected {
            color: var(--red);
        }


        /* =================================================
           EARNINGS FORM
        ================================================= */

        .earning-form {
            display: grid;

            grid-template-columns:
                1.4fr 1fr 1.6fr auto;

            gap: 12px;

            align-items: end;
        }


        .form-group {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .form-group label {
            color: var(--muted);

            font-size: 0.8rem;
        }


        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            border-radius: 7px;

            border:
                1px solid rgba(212, 175, 55, 0.3);

            background: #0b0b0b;

            color: var(--text);

            font-family: inherit;

            outline: none;
        }


        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--gold);
        }


        .earning-submit {
            padding: 12px 16px;

            border: none;

            border-radius: 7px;

            background: var(--gold);

            color: #000;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;
        }


        .earning-submit:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =================================================
           RECEIPT MODAL
        ================================================= */

        .receipt-modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,0.82);
        }


        .receipt-modal.show {
            display: flex;
        }


        .receipt-modal-content {
            width: min(900px, 100%);

            max-height: 90vh;

            overflow: auto;

            background: #111;

            border:
                1px solid var(--border);

            border-radius: 14px;

            padding: 20px;
        }


        .receipt-modal-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 15px;
        }


        .receipt-modal-header h3 {
            margin: 0;

            color: var(--gold);
        }


        .receipt-close {
            border: 1px solid
                rgba(255,255,255,0.15);

            background: transparent;

            color: var(--text);

            width: 36px;

            height: 36px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 1rem;
        }


        .receipt-preview {
            width: 100%;

            min-height: 300px;

            border-radius: 8px;

            background: #080808;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .receipt-preview img {
            max-width: 100%;

            max-height: 70vh;

            object-fit: contain;
        }


        .receipt-preview iframe {
            width: 100%;

            height: 70vh;

            border: none;
        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (max-width: 1200px) {

            .stats-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 1000px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }


            .earning-form {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .earning-submit {
                width: 100%;
            }

        }


        @media (max-width: 600px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }


            .stat-card {
                padding: 15px;
            }


            .stat-card strong {
                font-size: 1.4rem;
            }


            .stat-card.total-invested strong {
                font-size: 1.15rem;
            }


            .admin-container {
                width: 94%;

                padding-top: 25px;
            }


            .earning-form {
                grid-template-columns: 1fr;
            }


            .admin-header {
                padding: 15px 4%;
            }


            .admin-brand h1 {
                font-size: 1rem;
            }


            .admin-badge {
                font-size: 0.6rem;
            }


            .section-card {
                padding: 15px;
            }

        }


        @media (max-width: 400px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>
