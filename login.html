<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Monarch Codex</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="index.html" class="logo">
            MONARCH <span>CODEX</span>
        </a>

        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <p class="eyebrow">
                MONARCH CODEX
            </p>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to access your Monarch Codex account.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <div
            id="loginMessage"
            class="form-message"
            style="margin-top:15px;text-align:center;"
        ></div>


        <div class="auth-footer">

            <p>
                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


            <p>

                <a href="index.html">
                    ← Back to Monarch Codex
                </a>

            </p>

        </div>

    </div>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            ©
            <span id="currentYear"></span>
            Monarch Codex.
            All rights reserved.
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://avaworleivncevaoqeny.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");


function showMessage(
    text,
    type = "error"
) {

    loginMessage.textContent =
        text;


    loginMessage.style.display =
        "block";


    if (type === "success") {

        loginMessage.style.color =
            "#D4AF37";

    } else if (type === "info") {

        loginMessage.style.color =
            "#ffffff";

    } else {

        loginMessage.style.color =
            "#ff6b6b";

    }

}


function setLoading(
    loading
) {

    loginButton.disabled =
        loading;

    loginButton.textContent =
        loading
            ? "Logging in..."
            : "Login";

}


async function loginUser(event) {

    event.preventDefault();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    setLoading(true);


    showMessage(
        "Logging in...",
        "info"
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Login failed.",
                "error"
            );

            setLoading(false);

            return;
        }


        if (!data || !data.user) {

            showMessage(
                "Login failed. No user account was returned.",
                "error"
            );

            setLoading(false);

            return;
        }


        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, full_name, role, status, uid"
                )
                .eq(
                    "id",
                    data.user.id
                )
                .single();


        if (profileError) {

            console.error(
                "PROFILE ERROR:",
                profileError
            );


            await supabaseClient.auth.signOut();


            showMessage(
                "Your account was found, but your member profile could not be loaded. Please contact support.",
                "error"
            );

            setLoading(false);

            return;
        }


        if (!profile) {

            await supabaseClient.auth.signOut();


            showMessage(
                "No member profile was found for this account.",
                "error"
            );

            setLoading(false);

            return;
        }


        if (
            profile.status ===
            "blocked"
        ) {

            await supabaseClient.auth.signOut();


            showMessage(
                "Your account has been blocked. Please contact support.",
                "error"
            );

            setLoading(false);

            return;
        }


        if (
            profile.role === "admin" &&
            profile.status === "active"
        ) {

            showMessage(
                "Admin login successful. Loading dashboard...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "admin.html";

                },
                500
            );

            return;
        }


        if (
            profile.status ===
            "pending"
        ) {

            await supabaseClient.auth.signOut();


            showMessage(
                "Your account is pending approval. Please wait for an administrator to activate your account.",
                "error"
            );

            setLoading(false);

            return;
        }


        if (
            profile.status !==
            "active"
        ) {

            await supabaseClient.auth.signOut();


            showMessage(
                "Your account is not currently active. Please contact support.",
                "error"
            );

            setLoading(false);

            return;
        }


        showMessage(
            "Login successful. Loading your dashboard...",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "dashboard.html";

            },
            500
        );


    } catch (error) {

        console.error(
            "UNEXPECTED LOGIN ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Unable to login. Please try again.",
            "error"
        );


        setLoading(false);

    }

}


loginForm.addEventListener(
    "submit",
    loginUser
);


document.getElementById(
    "currentYear"
).textContent =
    new Date().getFullYear();

</script>


</body>
</html>
