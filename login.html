<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONARCH CODEX — Login Test</title>
</head>
<body>
  <h1>MONARCH CODEX</h1>
  <h2>Basic Login Test</h2>

  <form id="loginForm">
    <label for="email">Email</label><br>
    <input id="email" type="email" autocomplete="email" required><br><br>

    <label for="password">Password</label><br>
    <input id="password" type="password" autocomplete="current-password" required><br><br>

    <button id="loginButton" type="submit">Sign In</button>
  </form>

  <p id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    "use strict";

    const SUPABASE_URL = "https://avaworleivncevaoqeny.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      status.textContent = "Signing in...";
      button.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        if (!data.session || !data.user) {
          throw new Error("Supabase returned no active session.");
        }

        status.textContent =
          "LOGIN SUCCESSFUL — " + (data.user.email || "Account authenticated.");
      } catch (error) {
        console.error("Login test error:", error);
        status.textContent = "LOGIN FAILED — " + (error?.message || String(error));
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
