<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Monarch Codex</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="site-header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            MONARCH <span>CODEX</span>
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </div>

</header>



<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <p class="eyebrow">
                MONARCH CODEX
            </p>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to access your Monarch Codex account.
            </p>

        </div>



        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <button
                type="submit"
                class="btn btn-primary auth-submit"
                id="loginButton"
            >
                Login
            </button>

        </form>



        <div
            id="loginMessage"
            class="form-message"
            style="margin-top:15px;text-align:center;"
        ></div>



        <div class="auth-footer">

            <p>

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


            <p>

                <a href="index.html">
                    ← Back to Monarch Codex
                </a>

            </p>

        </div>

    </div>

</main>



<footer class="site-footer">

    <div class="container">

        <p>

            ©
            <span id="currentYear"></span>
            Monarch Codex.
            All rights reserved.

        </p>

    </div>

</footer>



<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     MONARCH CODEX CORE
     ===================================================== -->

<script src="script.js"></script>



<script>

(function () {

    "use strict";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const loginMessage =
        document.getElementById(
            "loginMessage"
        );

    const currentYear =
        document.getElementById(
            "currentYear"
        );


    /* =====================================================
       YEAR
       ===================================================== */

    if (currentYear) {

        currentYear.textContent =
            new Date().getFullYear();

    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showLoginMessage(
        message,
        type = "error"
    ) {

        if (!loginMessage) {
            return;
        }

        loginMessage.textContent =
            message;

        loginMessage.style.display =
            "block";

        loginMessage.className =
            "form-message";

        if (type === "success") {

            loginMessage.style.color =
                "#D4AF37";

        } else if (type === "info") {

            loginMessage.style.color =
                "#ffffff";

        } else {

            loginMessage.style.color =
                "#ff6b6b";

        }

    }


    /* =====================================================
       LOADING STATE
       ===================================================== */

    function setLoading(
        loading
    ) {

        if (!loginButton) {
            return;
        }

        loginButton.disabled =
            loading;

        loginButton.textContent =
            loading
                ? "Logging in..."
                : "Login";

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    async function loginUser(
        event
    ) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showLoginMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        const core =
            window.MonarchCodex?.core;


        if (!core) {

            showLoginMessage(
                "The MONARCH CODEX system could not be loaded. Please refresh the page.",
                "error"
            );

            return;

        }


        const supabase =
            core.getSupabase();


        if (!supabase) {

            showLoginMessage(
                "Unable to connect to the authentication system. Please try again.",
                "error"
            );

            return;

        }


        setLoading(true);


        showLoginMessage(
            "Logging in...",
            "info"
        );


        try {

            const {
                data,
                error
            } =
                await supabase.auth
                    .signInWithPassword({

                        email,

                        password

                    });


            if (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );

                showLoginMessage(
                    error.message ||
                    "Login failed.",
                    "error"
                );

                setLoading(false);

                return;

            }


            if (
                !data ||
                !data.user
            ) {

                showLoginMessage(
                    "Login failed. No user account was returned.",
                    "error"
                );

                setLoading(false);

                return;

            }


            const profile =
                await core.getCurrentProfile();


            if (!profile) {

                await supabase.auth
                    .signOut();

                showLoginMessage(
                    "Your account was found, but your member profile could not be loaded. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /* =================================================
               BLOCKED ACCOUNT
               ================================================= */

            if (
                profile.status ===
                "blocked"
            ) {

                await supabase.auth
                    .signOut();

                showLoginMessage(
                    "Your account has been blocked. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /* =================================================
               ADMIN
               ================================================= */

            if (
                core.isAdmin(profile) &&
                profile.status ===
                "active"
            ) {

                showLoginMessage(
                    "Admin login successful. Loading dashboard...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "admin.html";

                    },
                    400
                );

                return;

            }


            /* =================================================
               PENDING
               ================================================= */

            if (
                profile.status ===
                "pending"
            ) {

                await supabase.auth
                    .signOut();

                showLoginMessage(
                    "Your account is pending approval. Please wait for an administrator to activate your account.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /* =================================================
               NON-ACTIVE ACCOUNT
               ================================================= */

            if (
                profile.status !==
                "active"
            ) {

                await supabase.auth
                    .signOut();

                showLoginMessage(
                    "Your account is not currently active. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }


            /* =================================================
               MEMBER
               ================================================= */

            showLoginMessage(
                "Login successful. Loading your dashboard...",
                "success"
            );


            setTimeout(
                function () {

                    window.location.href =
                        "dashboard.html";

                },
                400
            );


        } catch (error) {

            console.error(
                "UNEXPECTED LOGIN ERROR:",
                error
            );


            showLoginMessage(
                error?.message ||
                "Unable to login. Please try again.",
                "error"
            );


            setLoading(false);

        }

    }


    /* =====================================================
       FORM LISTENER
       ===================================================== */

    if (loginForm) {

        loginForm.addEventListener(
            "submit",
            loginUser
        );

    }


})();

</script>


</body>

</html>
