<style>
    :root{
        --mc-gold:#D4AF37;
        --mc-gold-light:#F4D675;
        --mc-black:#070707;
        --mc-card:#121212;
        --mc-border:rgba(212,175,55,.35);
        --mc-muted:#a8a8a8;
        --mc-white:#f7f7f7;
    }

    *{box-sizing:border-box}

    html,body{
        margin:0;
        padding:0;
        min-height:100%;
    }

    body{
        background:
            radial-gradient(circle at 50% 0%, rgba(212,175,55,.12), transparent 34%),
            radial-gradient(circle at 100% 70%, rgba(212,175,55,.06), transparent 30%),
            var(--mc-black) !important;
        color:var(--mc-white) !important;
        font-family:"Poppins",Arial,sans-serif !important;
        min-height:100vh;
    }

    body::before{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        background:
            linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
            linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
        background-size:45px 45px;
        mask-image:linear-gradient(to bottom,black,transparent 85%);
    }

    a{
        color:var(--mc-gold) !important;
        text-decoration:none !important;
        transition:.2s ease;
    }

    a:hover{
        color:var(--mc-gold-light) !important;
    }

    .site-header{
        width:100%;
        background:rgba(7,7,7,.94) !important;
        border-bottom:1px solid var(--mc-border) !important;
        backdrop-filter:blur(14px);
        position:relative;
        z-index:5;
    }

    .container{
        width:min(1120px,92%);
        margin:0 auto;
    }

    .nav-container{
        min-height:76px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:24px;
    }

    .logo{
        color:var(--mc-white) !important;
        font-family:"Cinzel","Times New Roman",serif !important;
        font-size:20px;
        font-weight:700;
        letter-spacing:1.8px;
        white-space:nowrap;
    }

    .logo span{
        color:var(--mc-gold);
    }

    .main-nav{
        display:flex;
        align-items:center;
        gap:26px;
    }

    .main-nav a{
        color:#ddd !important;
        font-size:14px;
        font-weight:500;
    }

    .main-nav a:hover{
        color:var(--mc-gold) !important;
    }

    .auth-page{
        min-height:calc(100vh - 154px);
        display:flex !important;
        align-items:center;
        justify-content:center;
        padding:58px 16px 64px;
        position:relative;
        z-index:1;

    .auth-card{
        width:min(460px,100%);

            0 25px 80px rgba(0,0,0,.7),

        position:relative;
        overflow:hidden;
    }

    .auth-card::before{
        content:"";
        position:absolute;
        top:0;
        left:15%;
        right:15%;

        background:linear-gradient(90deg,transparent,var(--mc-gold),transparent);

    .auth-submit{

<script>

(function () {

    "use strict";


    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
        "https://avaworleivncevaoqeny.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";

    let supabase = null;



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    const currentYear =
        document.getElementById("currentYear");



    /* =====================================================
       YEAR
       ===================================================== */

    if (currentYear) {

        currentYear.textContent =
            new Date().getFullYear();

    }



    /* =====================================================
       MESSAGE
       ===================================================== */

    function showLoginMessage(
        message,
        type = "error"
    ) {

        if (!loginMessage) {
            return;
        }

        loginMessage.textContent =
            message;

        loginMessage.style.display =
            "block";

        loginMessage.className =
            "form-message";

        if (type === "success") {

            loginMessage.style.color =
                "#D4AF37";

        } else if (type === "info") {

            loginMessage.style.color =
                "#ffffff";

        } else {

            loginMessage.style.color =
                "#ff6b6b";

        }

    }



    /* =====================================================
       LOADING
       ===================================================== */

    function setLoading(loading) {

        if (!loginButton) {
            return;
        }

        loginButton.disabled =
            loading;

        loginButton.textContent =
            loading
                ? "Logging in..."
                : "Login";

    }



    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */

    function connectSupabase() {

        if (
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ) {

            throw new Error(
                "Supabase failed to load. Please refresh the page and try again."
            );

        }

        supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );

    }



    /* =====================================================
       PROFILE
       ===================================================== */

    async function getCurrentProfile(userId) {

        if (!userId) {
            return null;
        }

        const result =
            await supabase
                .from("profiles")
                .select("*")
                .eq("id", userId)
                .maybeSingle();

        if (result.error) {
            throw result.error;
        }

        return result.data || null;

    }



    /* =====================================================
       ADMIN CHECK

       Uses the existing MONARCH CODEX admin rules:
       - profiles.role = admin
       - existing admin email fallback
       ===================================================== */

    function isAdmin(profile, user) {

        const role =
            String(
                profile?.role || ""
            )
            .toLowerCase()
            .trim();

        const email =
            String(
                user?.email || ""
            )
            .toLowerCase()
            .trim();

        return (
            role === "admin" ||
            email === "trademonarchofficial@gmail.com"
        );

    }



    /* =====================================================
       LOGIN
       ===================================================== */

    async function loginUser(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showLoginMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        if (!supabase) {

            showLoginMessage(
                "The MONARCH CODEX authentication system is not ready. Please refresh the page.",
                "error"
            );

            return;

        }


        setLoading(true);

        showLoginMessage(
            "Logging in...",
            "info"
        );


        try {

            let authResult =
                await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            let data = authResult.data;
            let error = authResult.error;

            /*
             * If the browser cannot reach Supabase Auth directly,
             * retry once through the MONARCH CODEX Worker.
             * Invalid credentials are NOT proxied twice.
             */
            const directNetworkFailure =
                !!error &&
                /failed to fetch|networkerror|load failed|fetch failed/i.test(
                    String(error.message || "")
                );

            if (directNetworkFailure) {
                try {
                    const proxyResponse = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ email, password })
                        }
                    );

                    const proxyPayload = await proxyResponse.json().catch(() => null);

                    if (proxyResponse.ok && proxyPayload?.access_token && proxyPayload?.refresh_token) {
                        const sessionResult = await supabase.auth.setSession({
                            access_token: proxyPayload.access_token,
                            refresh_token: proxyPayload.refresh_token
                        });

                        data = sessionResult.data;
                        error = sessionResult.error;
                    } else {
                        error = new Error(
                            proxyPayload?.error ||
                            "MONARCH CODEX authentication could not be reached."
                        );
                    }
                } catch (proxyError) {
                    console.error("MONARCH CODEX AUTH PROXY ERROR:", proxyError);
                    error = new Error(
                        "MONARCH CODEX authentication could not be reached from this browser."
                    );
                }
            }

            if (error) {

                console.error(
                    "MONARCH CODEX LOGIN ERROR:",
                    error
                );

                showLoginMessage(
                    error.message ||
                    "Login failed. Please check your email and password.",
                    "error"
                );

                setLoading(false);

                return;

            }


            if (
                !data ||
                !data.user
            ) {

                showLoginMessage(
                    "Login failed. No user account was returned.",
                    "error"
                );

                setLoading(false);

                return;

            }


            const user =
                data.user;


            try {

                localStorage.setItem(
                    "monarch_last_email",
                    email
                );

            } catch (e) {
                console.warn(
                    "Could not save last email:",
                    e
                );
            }


            const profile =
                await getCurrentProfile(
                    user.id
                );


            if (!profile) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account was found, but your MONARCH CODEX member profile could not be loaded. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }



            /* =================================================
               BLOCKED ACCOUNT
               ================================================= */

            if (
                String(profile.status || "")
                    .toLowerCase()
                    .trim() === "blocked"
            ) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account has been blocked. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }



            /* =================================================
               ADMIN
               =================================================
               admin / super_admin / configured admin email
               keep the existing MAIN ADMIN route.
               ================================================= */

            if (isAdmin(profile, user)) {

                showLoginMessage(
                    "Admin login successful. Loading admin dashboard...",
                    "success"
                );

                setTimeout(function () {

                    window.location.replace(
                        "admin.html"
                    );

                }, 400);

                return;

            }



            /* =================================================
               ROLE-BASED ROUTING
               ================================================= */

            const profileRole =
                String(profile.role || "")
                    .toLowerCase()
                    .trim();

            if (
                profileRole === "sovereign_desk" ||
                profileRole === "sovereign-desk"
            ) {

                showLoginMessage(
                    "SOVEREIGN DESK login successful. Loading SOVEREIGN DESK...",
                    "success"
                );

                setTimeout(function () {

                    window.location.replace(
                        "sovereign_desk.html"
                    );

                }, 400);

                return;

            }


            /* =================================================
               MEMBER STATUS
               ================================================= */

            const profileStatus =
                String(
                    profile.status || ""
                )
                .toLowerCase()
                .trim();


            /*
             * A new verified Monarch normally starts as
             * pending_kyc. That status means the member is
             * allowed into the dashboard so the KYC process
             * can be completed.
             *
             * Only blocked accounts are denied here.
             */


            if (
                profileStatus === "pending"
            ) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account is pending approval. Please wait for an administrator to activate your account.",
                    "error"
                );

                setLoading(false);

                return;

            }


            if (
                profileStatus !== "active" &&
                profileStatus !== "pending_kyc"
            ) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account is not currently active. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }



            /* =================================================
               MEMBER
               ================================================= */

            showLoginMessage(
                "Login successful. Loading your dashboard...",
                "success"
            );


            setTimeout(function () {

                window.location.replace(
                    "dashboard.html"
                );

            }, 400);


        } catch (error) {

            console.error(
                "UNEXPECTED MONARCH CODEX LOGIN ERROR:",
                error
            );


            const networkFailure =
                /failed to fetch|networkerror|load failed|fetch failed/i.test(
                    String(error?.message || "")
                );

            showLoginMessage(
                networkFailure
                    ? "Connection to MONARCH CODEX authentication failed. Please check your internet connection and try again."
                    : (
                        error?.message ||
                        "Unable to login. Please try again."
                    ),
                "error"
            );


            try {
                await supabase.auth.signOut();
            } catch (signOutError) {
                console.warn(
                    "Sign-out after login error failed:",
                    signOutError
                );
            }


            setLoading(false);

        }

    }



    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            try {

                connectSupabase();

            } catch (error) {

                console.error(
                    "MONARCH CODEX SUPABASE INIT ERROR:",
                    error
                );

                showLoginMessage(
                    error?.message ||
                    "The authentication system could not be loaded. Please refresh the page.",
                    "error"
                );

            }


            const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");
        if (passwordInput && passwordToggle) {
            passwordToggle.addEventListener("click", function () {
                const showing = passwordInput.type === "text";
                passwordInput.type = showing ? "password" : "text";
                passwordToggle.innerHTML = showing ? "<svg class=\"password-eye\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z\"></path><circle cx=\"12\" cy=\"12\" r=\"2.5\"></circle></svg>" : "<svg class=\"password-eye\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m3 3 18 18\"></path><path d=\"M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.4 18.4 0 0 1-3.1 3.8\"></path><path d=\"M6.1 6.1C3.4 8.1 2 12 2 12s3.5 6 10 6c1.6 0 3-.4 4.2-.9\"></path><path d=\"M9.9 9.9a3 3 0 0 0 4.2 4.2\"></path></svg>";
                passwordToggle.setAttribute("aria-label", showing ? "Show password" : "Hide password"); passwordToggle.setAttribute("title", showing ? "Show password" : "Hide password");
                passwordToggle.setAttribute("aria-pressed", String(!showing));
            });
        }

        if (loginForm) {

                loginForm.addEventListener(
                    "submit",
                    loginUser
                );

            }

        }
    );


})();

</script>
