<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Monarch Codex</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="container nav-container">

            <a href="index.html" class="logo">
                MONARCH <span>CODEX</span>
            </a>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
            </nav>

        </div>
    </header>


    <!-- LOGIN SECTION -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">
                <p class="eyebrow">MONARCH CODEX</p>

                <h1>Welcome Back</h1>

                <p>
                    Login to access your Monarch Codex dashboard.
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Login
                </button>

            </form>


            <div
                id="loginMessage"
                class="form-message"
            ></div>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

                <p>
                    <a href="index.html">
                        ← Back to Monarch Codex
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="container">

            <p>
                ©
                <span id="currentYear"></span>
                Monarch Codex.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- SUPABASE MUST LOAD BEFORE SCRIPT.JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>


    <script>
        document.getElementById("currentYear").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
