<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Monarch Codex</title>

    <link rel="stylesheet" href="style.css">

    <!-- Premium login styling is also included below so this page remains styled even if style.css is unavailable. -->


<style>
    :root{
        --mc-gold:#D4AF37;
        --mc-gold-light:#F4D675;
        --mc-black:#070707;
        --mc-card:#121212;
        --mc-border:rgba(212,175,55,.35);
        --mc-muted:#a8a8a8;
        --mc-white:#f7f7f7;
    }

    *{box-sizing:border-box}

    html,body{
        margin:0;
        padding:0;
        min-height:100%;
    }

    body{
        background:
            radial-gradient(circle at 50% 0%, rgba(212,175,55,.12), transparent 34%),
            radial-gradient(circle at 100% 70%, rgba(212,175,55,.06), transparent 30%),
            var(--mc-black) !important;
        color:var(--mc-white) !important;
        font-family:"Poppins",Arial,sans-serif !important;
        min-height:100vh;
    }

    body::before{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        background:
            linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
            linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
        background-size:45px 45px;
        mask-image:linear-gradient(to bottom,black,transparent 85%);
    }

    a{
        color:var(--mc-gold) !important;
        text-decoration:none !important;
        transition:.2s ease;
    }

    a:hover{
        color:var(--mc-gold-light) !important;
    }

    .site-header{
        width:100%;
        background:rgba(7,7,7,.94) !important;
        border-bottom:1px solid var(--mc-border) !important;
        backdrop-filter:blur(14px);
        position:relative;
        z-index:5;
    }

    .container{
        width:min(1120px,92%);
        margin:0 auto;
    }

    .nav-container{
        min-height:76px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:24px;
    }

    .logo{
        color:var(--mc-white) !important;
        font-family:"Cinzel","Times New Roman",serif !important;
        font-size:20px;
        font-weight:700;
        letter-spacing:1.8px;
        white-space:nowrap;
    }

    .logo span{
        color:var(--mc-gold);
    }

    .main-nav{
        display:flex;
        align-items:center;
        gap:26px;
    }

    .main-nav a{
        color:#ddd !important;
        font-size:14px;
        font-weight:500;
    }

    .main-nav a:hover{
        color:var(--mc-gold) !important;
    }

    .auth-page{
        min-height:calc(100vh - 154px);
        display:flex !important;
        align-items:center;
        justify-content:center;
        padding:58px 16px 64px;
        position:relative;
        z-index:1;
    }

    .auth-card{
        width:min(460px,100%);
        background:linear-gradient(145deg,rgba(25,25,25,.97),rgba(10,10,10,.97)) !important;
        border:1px solid var(--mc-border) !important;
        border-radius:20px !important;
        padding:42px 36px 34px !important;
        box-shadow:
            0 25px 80px rgba(0,0,0,.7),
            0 0 45px rgba(212,175,55,.08),
            inset 0 1px 0 rgba(255,255,255,.04);
        position:relative;
        overflow:hidden;
    }

    .auth-card::before{
        content:"";
        position:absolute;
        top:0;
        left:15%;
        right:15%;
        height:2px;
        background:linear-gradient(90deg,transparent,var(--mc-gold),transparent);
        box-shadow:0 0 18px rgba(212,175,55,.5);
    }

    .auth-header{
        text-align:center;
        margin-bottom:30px;
    }

    .auth-header .eyebrow{
        color:var(--mc-gold) !important;
        font-size:12px;
        font-weight:700;
        letter-spacing:3px;
        margin:0 0 12px;
    }

    .auth-header h1{
        color:#fff !important;
        font-family:"Cinzel","Times New Roman",serif !important;
        font-size:clamp(30px,7vw,42px);
        line-height:1.15;
        margin:0 0 13px;
        letter-spacing:.5px;
    }

    .auth-header > p:last-child{
        color:#aaa !important;
        font-size:14px;
        line-height:1.7;
        margin:0;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        color:#e9e9e9 !important;
        font-size:13px;
        font-weight:600;
        margin-bottom:8px;
    }

    .form-group input{
        width:100% !important;
        min-height:52px;
        border:1px solid #363636 !important;
        border-radius:10px !important;
        background:#0b0b0b !important;
        color:#fff !important;
        padding:0 15px !important;
        font-family:"Poppins",Arial,sans-serif !important;
        font-size:14px !important;
        outline:none;
        box-shadow:none !important;
        transition:.2s ease;
    }

    .form-group input::placeholder{
        color:#666 !important;
    }

    .form-group input:focus{
        border-color:var(--mc-gold) !important;
        box-shadow:0 0 0 3px rgba(212,175,55,.09) !important;
    }

    .auth-submit{
        width:100% !important;
        min-height:52px;
        border:1px solid var(--mc-gold) !important;
        border-radius:10px !important;
        background:linear-gradient(135deg,#D4AF37,#a98718) !important;
        color:#080808 !important;
        font-family:"Poppins",Arial,sans-serif !important;
        font-size:15px !important;
        font-weight:700 !important;
        letter-spacing:.3px;
        cursor:pointer;
        margin-top:4px;
        transition:.2s ease;
        box-shadow:0 8px 25px rgba(212,175,55,.13);
    }

    .auth-submit:hover:not(:disabled){
        transform:translateY(-1px);
        box-shadow:0 12px 30px rgba(212,175,55,.22);
        filter:brightness(1.06);
    }

    .auth-submit:disabled{
        opacity:.65;
        cursor:not-allowed;
    }

    .form-message{
        min-height:24px;
        font-size:13px !important;
        line-height:1.55;
    }

    .auth-footer{
        border-top:1px solid rgba(255,255,255,.08);
        margin-top:28px;
        padding-top:22px;
        text-align:center;
    }

    .auth-footer p{
        color:#999 !important;
        font-size:13px !important;
        line-height:1.6;
        margin:9px 0;
    }

    .auth-footer a{
        font-weight:600;
    }

    .site-footer{
        background:#050505 !important;
        border-top:1px solid rgba(212,175,55,.15) !important;
        color:#777 !important;
        position:relative;
        z-index:1;
    }

    .site-footer .container{
        min-height:78px;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
    }

    .site-footer p{
        color:#777 !important;
        font-size:12px !important;
        margin:0;
    }

    @media(max-width:600px){
        .nav-container{
            min-height:68px;
        }

        .logo{
            font-size:16px;
            letter-spacing:1.2px;
        }

        .main-nav{
            gap:14px;
        }

        .main-nav a{
            font-size:12px;
        }

        .auth-page{
            min-height:calc(100vh - 146px);
            padding:35px 14px 45px;
        }

        .auth-card{
            padding:32px 22px 28px !important;
            border-radius:16px !important;
        }

        .auth-header h1{
            font-size:31px;
        }
    }
</style>

</head>


<body>

<header class="site-header">

    <div class="container nav-container">

        <a
            href="index.html"
            class="logo"
        >
            MONARCH <span>CODEX</span>
        </a>


        <nav class="main-nav">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </div>

</header>



<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <p class="eyebrow">
                MONARCH CODEX
            </p>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to access your Monarch Codex account.
            </p>

        </div>



        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
                id="loginButton"
            >
                Login
            </button>

        </form>



        <div
            id="loginMessage"
            class="form-message"
            style="margin-top:15px;text-align:center;"
        ></div>



        <div class="auth-footer">

            <p>

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


            <p>

                <a href="index.html">
                    ← Back to Monarch Codex
                </a>

            </p>

        </div>

    </div>

</main>



<footer class="site-footer">

    <div class="container">

        <p>

            ©
            <span id="currentYear"></span>
            Monarch Codex.
            All rights reserved.

        </p>

    </div>

</footer>



<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     MONARCH CODEX LOGIN

     This page intentionally uses its own Supabase client.
     It does not depend on script.js.
     ===================================================== -->

<script>

(function () {

    "use strict";


    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
        "https://avaworleivncevaoqeny.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_OZCDmpzZ1-pvN1rfTGqrpw_JatYPjIh";

    let supabase = null;



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    const currentYear =
        document.getElementById("currentYear");



    /* =====================================================
       YEAR
       ===================================================== */

    if (currentYear) {

        currentYear.textContent =
            new Date().getFullYear();

    }



    /* =====================================================
       MESSAGE
       ===================================================== */

    function showLoginMessage(
        message,
        type = "error"
    ) {

        if (!loginMessage) {
            return;
        }

        loginMessage.textContent =
            message;

        loginMessage.style.display =
            "block";

        loginMessage.className =
            "form-message";

        if (type === "success") {

            loginMessage.style.color =
                "#D4AF37";

        } else if (type === "info") {

            loginMessage.style.color =
                "#ffffff";

        } else {

            loginMessage.style.color =
                "#ff6b6b";

        }

    }



    /* =====================================================
       LOADING
       ===================================================== */

    function setLoading(loading) {

        if (!loginButton) {
            return;
        }

        loginButton.disabled =
            loading;

        loginButton.textContent =
            loading
                ? "Logging in..."
                : "Login";

    }



    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */

    function connectSupabase() {

        if (
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ) {

            throw new Error(
                "Supabase failed to load. Please refresh the page and try again."
            );

        }

        supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );

    }



    /* =====================================================
       PROFILE
       ===================================================== */

    async function getCurrentProfile(userId) {

        if (!userId) {
            return null;
        }

        const result =
            await supabase
                .from("profiles")
                .select("*")
                .eq("id", userId)
                .maybeSingle();

        if (result.error) {
            throw result.error;
        }

        return result.data || null;

    }



    /* =====================================================
       ADMIN CHECK

       Uses the existing MONARCH CODEX admin rules:
       - profiles.role = admin
       - existing admin email fallback
       ===================================================== */

    function isAdmin(profile, user) {

        const role =
            String(
                profile?.role || ""
            )
            .toLowerCase()
            .trim();

        const email =
            String(
                user?.email || ""
            )
            .toLowerCase()
            .trim();

        return (
            role === "admin" ||
            email === "trademonarchofficial@gmail.com"
        );

    }



    /* =====================================================
       LOGIN
       ===================================================== */

    async function loginUser(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showLoginMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        if (!supabase) {

            showLoginMessage(
                "The MONARCH CODEX authentication system is not ready. Please refresh the page.",
                "error"
            );

            return;

        }


        setLoading(true);

        showLoginMessage(
            "Logging in...",
            "info"
        );


        try {

            const {
                data,
                error
            } =
                await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(
                    "MONARCH CODEX LOGIN ERROR:",
                    error
                );

                showLoginMessage(
                    error.message ||
                    "Login failed. Please check your email and password.",
                    "error"
                );

                setLoading(false);

                return;

            }


            if (
                !data ||
                !data.user
            ) {

                showLoginMessage(
                    "Login failed. No user account was returned.",
                    "error"
                );

                setLoading(false);

                return;

            }


            const user =
                data.user;


            try {

                localStorage.setItem(
                    "monarch_last_email",
                    email
                );

            } catch (e) {
                console.warn(
                    "Could not save last email:",
                    e
                );
            }


            const profile =
                await getCurrentProfile(
                    user.id
                );


            if (!profile) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account was found, but your MONARCH CODEX member profile could not be loaded. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }



            /* =================================================
               BLOCKED ACCOUNT
               ================================================= */

            if (
                String(profile.status || "")
                    .toLowerCase()
                    .trim() === "blocked"
            ) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account has been blocked. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }



            /* =================================================
               ADMIN
               ================================================= */

            if (isAdmin(profile, user)) {

                showLoginMessage(
                    "Admin login successful. Loading admin dashboard...",
                    "success"
                );

                setTimeout(function () {

                    window.location.replace(
                        "admin.html"
                    );

                }, 400);

                return;

            }



            /* =================================================
               MEMBER STATUS
               ================================================= */

            const profileStatus =
                String(
                    profile.status || ""
                )
                .toLowerCase()
                .trim();


            /*
             * A new verified Monarch normally starts as
             * pending_kyc. That status means the member is
             * allowed into the dashboard so the KYC process
             * can be completed.
             *
             * Only blocked accounts are denied here.
             */


            if (
                profileStatus === "pending"
            ) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account is pending approval. Please wait for an administrator to activate your account.",
                    "error"
                );

                setLoading(false);

                return;

            }


            if (
                profileStatus !== "active" &&
                profileStatus !== "pending_kyc"
            ) {

                await supabase.auth.signOut();

                showLoginMessage(
                    "Your account is not currently active. Please contact support.",
                    "error"
                );

                setLoading(false);

                return;

            }



            /* =================================================
               MEMBER
               ================================================= */

            showLoginMessage(
                "Login successful. Loading your dashboard...",
                "success"
            );


            setTimeout(function () {

                window.location.replace(
                    "dashboard.html"
                );

            }, 400);


        } catch (error) {

            console.error(
                "UNEXPECTED MONARCH CODEX LOGIN ERROR:",
                error
            );


            showLoginMessage(
                error?.message ||
                "Unable to login. Please try again.",
                "error"
            );


            try {
                await supabase.auth.signOut();
            } catch (signOutError) {
                console.warn(
                    "Sign-out after login error failed:",
                    signOutError
                );
            }


            setLoading(false);

        }

    }



    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            try {

                connectSupabase();

            } catch (error) {

                console.error(
                    "MONARCH CODEX SUPABASE INIT ERROR:",
                    error
                );

                showLoginMessage(
                    error?.message ||
                    "The authentication system could not be loaded. Please refresh the page.",
                    "error"
                );

            }


            if (loginForm) {

                loginForm.addEventListener(
                    "submit",
                    loginUser
                );

            }

        }
    );


})();

</script>


</body>

</html>
